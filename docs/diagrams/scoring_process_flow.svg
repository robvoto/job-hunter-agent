<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2860" viewBox="0 0 1400 2860" role="img" aria-labelledby="title desc">
  <title id="title">Scoring process flow</title>
  <desc id="desc">Static openable render of docs/diagrams/scoring_process_flow.mmd.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .node-text { font: 600 16px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small-text { font: 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .tiny-text { font: 12px Arial, Helvetica, sans-serif; fill: #64748b; }
      .process { fill: #e8f1ff; stroke: #1d4ed8; stroke-width: 2.2; }
      .decision { fill: #fff7db; stroke: #a16207; stroke-width: 2.2; }
      .end { fill: #ffe4e6; stroke: #be123c; stroke-width: 2.2; }
      .branch { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.0; }
      .note-line { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-muted { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="2860" />

  <text class="title" x="700" y="48" text-anchor="middle">Scoring Process Flow</text>
  <text class="subtitle" x="700" y="74" text-anchor="middle">Openable render of the Mermaid source in docs/diagrams/scoring_process_flow.mmd</text>

  <!-- Main intake path -->
  <ellipse class="end" cx="700" cy="120" rx="110" ry="28" />
  <text class="node-text" x="700" y="125" text-anchor="middle">
    <tspan x="700" dy="0">Start: Job found</tspan>
  </text>

  <rect class="process" x="390" y="180" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="206" text-anchor="middle">
    <tspan x="700" dy="0">Scraper captures job record</tspan>
  </text>

  <rect class="process" x="390" y="280" rx="16" ry="16" width="620" height="78" />
  <text class="node-text" x="700" y="307" text-anchor="middle">
    <tspan x="700" dy="0">Normalise source fields</tspan>
    <tspan x="700" dy="20">title, company, location, salary, work mode, description</tspan>
  </text>
  <text class="small-text" x="700" y="376" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: structured job metadata stays separate from description text.</tspan>
  </text>

  <polygon class="decision" points="700,380 800,430 700,480 600,430" />
  <text class="node-text" x="700" y="424" text-anchor="middle">
    <tspan x="700" dy="0">Enough basic data</tspan>
    <tspan x="700" dy="20">to assess?</tspan>
  </text>

  <!-- Decision 1 branches -->
  <path class="line" d="M 600 430 L 470 430 L 470 560" />
  <text class="tiny-text" x="510" y="452">No</text>
  <rect class="branch" x="60" y="524" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="240" y="552" text-anchor="middle">
    <tspan x="240" dy="0">Mark incomplete / low trust</tspan>
    <tspan x="240" dy="20">do not invent missing data</tspan>
  </text>
  <ellipse class="end" cx="240" cy="650" rx="150" ry="28" />
  <text class="node-text" x="240" y="655" text-anchor="middle">
    <tspan x="240" dy="0">End: Needs review or skipped</tspan>
  </text>
  <path class="line-muted" d="M 420 560 L 420 650 L 390 650" />

  <path class="line" d="M 700 480 L 700 560" />
  <text class="tiny-text" x="712" y="520">Yes</text>

  <rect class="process" x="390" y="560" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="586" text-anchor="middle">
    <tspan x="700" dy="0">Run deterministic pre-LLM checks</tspan>
  </text>
  <text class="small-text" x="700" y="640" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: cheap deterministic checks run before expensive LLM review.</tspan>
  </text>

  <polygon class="decision" points="700,660 800,710 700,760 600,710" />
  <text class="node-text" x="700" y="704" text-anchor="middle">
    <tspan x="700" dy="0">Approved hard blocker?</tspan>
  </text>

  <!-- Decision 2 branches -->
  <path class="line" d="M 600 710 L 450 710 L 450 835" />
  <text class="tiny-text" x="486" y="732">Yes</text>
  <rect class="branch" x="60" y="792" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="240" y="820" text-anchor="middle">
    <tspan x="240" dy="0">Reject before LLM</tspan>
    <tspan x="240" dy="20">record blocker reason</tspan>
  </text>
  <ellipse class="end" cx="240" cy="930" rx="110" ry="28" />
  <text class="node-text" x="240" y="935" text-anchor="middle">
    <tspan x="240" dy="0">End: Rejected</tspan>
  </text>
  <path class="line-muted" d="M 420 835 L 420 930 L 350 930" />

  <path class="line" d="M 700 760 L 700 830" />
  <text class="tiny-text" x="712" y="801">No</text>

  <polygon class="decision" points="700,780 800,830 700,880 600,830" />
  <text class="node-text" x="700" y="824" text-anchor="middle">
    <tspan x="700" dy="0">O*NET title / occupation taxonomy</tspan>
    <tspan x="700" dy="20">clearly outside target?</tspan>
  </text>
  <text class="small-text" x="700" y="896" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: near / far / uncertain classification uses target occupation queries.</tspan>
  </text>

  <!-- Decision 3 branches -->
  <path class="line" d="M 600 830 L 450 830 L 450 965" />
  <text class="tiny-text" x="482" y="852">Yes</text>
  <rect class="branch" x="60" y="924" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="240" y="952" text-anchor="middle">
    <tspan x="240" dy="0">Reject before LLM</tspan>
    <tspan x="240" dy="20">title or taxonomy reason</tspan>
  </text>
  <path class="line-muted" d="M 420 965 L 420 930 L 350 930" />

  <path class="line" d="M 700 880 L 700 960" />
  <text class="tiny-text" x="712" y="924">No / uncertain</text>

  <rect class="process" x="390" y="960" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="986" text-anchor="middle">
    <tspan x="700" dy="0">Prepare fit review input</tspan>
    <tspan x="700" dy="20">structured metadata + fit_source_text</tspan>
  </text>
  <text class="small-text" x="700" y="1036" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: description compaction + trust metadata; full description remains preserved.</tspan>
  </text>

  <polygon class="decision" points="700,1060 800,1110 700,1160 600,1110" />
  <text class="node-text" x="700" y="1104" text-anchor="middle">
    <tspan x="700" dy="0">Safe deterministic review</tspan>
    <tspan x="700" dy="20">available?</tspan>
  </text>

  <!-- Decision 4 branches -->
  <path class="line" d="M 600 1110 L 520 1110 L 520 1220" />
  <text class="tiny-text" x="546" y="1132">Yes</text>
  <rect class="branch" x="60" y="1182" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="240" y="1210" text-anchor="middle">
    <tspan x="240" dy="0">Create deterministic review outcome</tspan>
    <tspan x="240" dy="20">grade + rationale + review_source</tspan>
  </text>

  <path class="line" d="M 800 1110 L 880 1110 L 880 1220" />
  <text class="tiny-text" x="832" y="1132">No</text>
  <rect class="branch" x="980" y="1182" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="1160" y="1210" text-anchor="middle">
    <tspan x="1160" dy="0">Send to LLM fit review</tspan>
  </text>

  <path class="line" d="M 240 1254 L 240 1290 L 700 1290" />
  <path class="line" d="M 1160 1254 L 1160 1290 L 700 1290" />

  <rect class="process" x="390" y="1290" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="1316" text-anchor="middle">
    <tspan x="700" dy="0">Extract requirements</tspan>
    <tspan x="700" dy="20">and map to candidate capabilities</tspan>
  </text>
  <text class="small-text" x="700" y="1368" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: LLM requirement coverage maps requirements to known candidate capabilities.</tspan>
  </text>

  <polygon class="decision" points="700,1390 800,1440 700,1490 600,1440" />
  <text class="node-text" x="700" y="1434" text-anchor="middle">
    <tspan x="700" dy="0">Requirement coverage usable?</tspan>
  </text>

  <!-- Decision 5 branches -->
  <path class="line" d="M 600 1440 L 520 1440 L 520 1550" />
  <text class="tiny-text" x="544" y="1462">No</text>
  <rect class="branch" x="60" y="1512" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="240" y="1540" text-anchor="middle">
    <tspan x="240" dy="0">Use model grade fallback</tspan>
    <tspan x="240" dy="20">flag coverage missing</tspan>
  </text>

  <path class="line" d="M 800 1440 L 880 1440 L 880 1550" />
  <text class="tiny-text" x="832" y="1462">Yes</text>
  <rect class="branch" x="980" y="1512" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="1160" y="1540" text-anchor="middle">
    <tspan x="1160" dy="0">Derive grade from coverage</tspan>
  </text>

  <path class="line" d="M 240 1584 L 240 1620 L 700 1620" />
  <path class="line" d="M 1160 1584 L 1160 1620 L 700 1620" />

  <rect class="process" x="390" y="1620" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="1646" text-anchor="middle">
    <tspan x="700" dy="0">Build frozen score breakdown</tspan>
  </text>

  <rect class="process" x="390" y="1710" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="1736" text-anchor="middle">
    <tspan x="700" dy="0">Apply grade band clamp</tspan>
    <tspan x="700" dy="20">score stays inside grade band</tspan>
  </text>
  <text class="small-text" x="700" y="1800" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: band-anchored scoring avoids pretending the score is a qualification percentage.</tspan>
  </text>

  <polygon class="decision" points="700,1830 800,1880 700,1930 600,1880" />
  <text class="node-text" x="700" y="1874" text-anchor="middle">
    <tspan x="700" dy="0">Hard blockers after review?</tspan>
  </text>

  <!-- Decision 6 branches -->
  <path class="line" d="M 600 1880 L 520 1880 L 520 1990" />
  <text class="tiny-text" x="544" y="1902">Yes</text>
  <rect class="branch" x="60" y="1942" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="240" y="1970" text-anchor="middle">
    <tspan x="240" dy="0">Apply hard blocker penalty</tspan>
    <tspan x="240" dy="20">force score near zero</tspan>
  </text>

  <path class="line" d="M 800 1880 L 880 1880 L 880 1990" />
  <text class="tiny-text" x="832" y="1902">No</text>
  <rect class="branch" x="980" y="1942" rx="14" ry="14" width="360" height="72" />
  <text class="node-text" x="1160" y="1970" text-anchor="middle">
    <tspan x="1160" dy="0">Store frozen score + explanation</tspan>
  </text>

  <path class="line" d="M 240 2014 L 240 2050 L 700 2050" />
  <path class="line" d="M 1160 2014 L 1160 2050 L 700 2050" />

  <rect class="process" x="390" y="2050" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="2076" text-anchor="middle">
    <tspan x="700" dy="0">Apply display-time ranking only</tspan>
    <tspan x="700" dy="20">freshness, viewed status</tspan>
  </text>
  <text class="small-text" x="700" y="2130" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: frozen score is separated from display score.</tspan>
  </text>

  <rect class="process" x="390" y="2140" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="2166" text-anchor="middle">
    <tspan x="700" dy="0">Show ranked job to user</tspan>
    <tspan x="700" dy="20">with explanation</tspan>
  </text>

  <polygon class="decision" points="700,2230 800,2280 700,2330 600,2280" />
  <text class="node-text" x="700" y="2274" text-anchor="middle">
    <tspan x="700" dy="0">User action</tspan>
  </text>

  <!-- Decision 7 branches -->
  <path class="line" d="M 600 2280 L 500 2280 L 500 2400" />
  <text class="tiny-text" x="520" y="2302">Apply / save</text>
  <rect class="branch" x="60" y="2440" rx="14" ry="14" width="300" height="66" />
  <text class="node-text" x="210" y="2467" text-anchor="middle">
    <tspan x="210" dy="0">Record positive action</tspan>
  </text>

  <path class="line" d="M 700 2330 L 700 2400" />
  <text class="tiny-text" x="712" y="2302">Skip / not for me</text>
  <rect class="branch" x="410" y="2440" rx="14" ry="14" width="300" height="66" />
  <text class="node-text" x="560" y="2467" text-anchor="middle">
    <tspan x="560" dy="0">Record rejection feedback</tspan>
  </text>

  <path class="line" d="M 800 2280 L 900 2280 L 900 2400" />
  <text class="tiny-text" x="830" y="2302">Needs correction</text>
  <rect class="branch" x="760" y="2440" rx="14" ry="14" width="360" height="66" />
  <text class="node-text" x="940" y="2467" text-anchor="middle">
    <tspan x="940" dy="0">Improve profile / rules / backlog</tspan>
  </text>

  <path class="line" d="M 210 2506 L 210 2550 L 700 2550" />
  <path class="line" d="M 560 2506 L 560 2550 L 700 2550" />
  <path class="line" d="M 940 2506 L 940 2550 L 700 2550" />

  <rect class="process" x="390" y="2550" rx="16" ry="16" width="620" height="62" />
  <text class="node-text" x="700" y="2576" text-anchor="middle">
    <tspan x="700" dy="0">Learning signal</tspan>
  </text>
  <text class="small-text" x="700" y="2630" text-anchor="middle">
    <tspan x="700" dy="0">Unique signal: user feedback improves future runs without silently changing scoring rules.</tspan>
  </text>

  <ellipse class="end" cx="700" cy="2735" rx="160" ry="30" />
  <text class="node-text" x="700" y="2740" text-anchor="middle">
    <tspan x="700" dy="0">End: Improves future runs</tspan>
  </text>

  <path class="line" d="M 700 2612 L 700 2702" />

  <!-- Soft guide separators -->
  <path class="note-line" d="M 90 255 L 1310 255" />
  <path class="note-line" d="M 90 1495 L 1310 1495" />
  <path class="note-line" d="M 90 2025 L 1310 2025" />
</svg>
