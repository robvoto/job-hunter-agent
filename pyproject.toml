[project]
name = "job-hunter-agent"
version = "0.1.0"
description = "Local-first job discovery and fit-evaluation system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "openai>=2.31.0,<3",
    "openpyxl>=3.1.0,<4",
    "pandas>=2.0.0,<3",
    "pillow>=11.0.0,<12",
    "playwright>=1.58.0,<2",
    "pydantic>=2.0.0,<3",
    "pystray>=0.19.0,<1",
    "python-docx>=1.1.0,<2",
    "python-dotenv>=1.0.0,<2",
    "python-jobspy>=0.1.0,<2",
    "requests>=2.31.0,<3",
    "uvicorn[standard]>=0.32.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.9.0,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
