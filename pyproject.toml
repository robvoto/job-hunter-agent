[project]
name = "job-hunter-agent"
version = "1.7.1"
description = "Local-first job discovery and fit-evaluation system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "pystray>=0.19.0,<1",
    "pillow>=11.0.0,<12",
    "pydantic>=2.0.0,<3",
    "uvicorn[standard]>=0.32.0,<1",
    "openai>=2.31.0,<3",
    "pandas>=2.0.0,<3",
    "openpyxl>=3.1.0,<4",
    "playwright>=1.58.0,<2",
    "python-jobspy>=1.1.82,<2",
    "python-dotenv>=1.0.0,<2",
    "python-docx>=1.1.0,<2",
    "httpx>=0.27.0,<1",
    "requests>=2.31.0,<3",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.0.3",
    "pytest-playwright>=0.5.2,<1",
    "pytest-timeout>=2.3.0,<3",
    "pytest-xdist>=3.8.0,<4",
    "ruff>=0.9.0,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm_e2e: real-LLM end-to-end test, costs money and is skipped unless explicitly opted into (see tests/e2e/README.md)",
]
# Click-testing (tests/e2e) boots a real server + browser and is much slower
# than the unit suite, so it is opt-in via the explicit wrapper in
# scripts/run-e2e.sh or a direct explicit path, not part of a bare `pytest` run.
norecursedirs = ["tests/e2e"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally load dotenv/configuration or defer imports to
# preserve startup ordering and avoid import cycles.
"desktop/launcher.py" = ["E402"]
"job_hunter_agent/db_seed.py" = ["E402"]
"job_hunter_agent/fastapi_app.py" = ["E402"]
"job_hunter_agent/global_settings.py" = ["F405"]
"job_hunter_agent/job_review_pipeline.py" = ["E402"]
"job_hunter_agent/profile_learning.py" = ["E402"]
"job_hunter_agent/source_connector.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
