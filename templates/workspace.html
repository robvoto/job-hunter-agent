<!doctype html>
<html lang="en">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
  <span class="ws-brand">
  <img src="/static/job_hunter_img.png" alt="" class="ws-brand-icon">
  <span>Job Hunter</span>
</span-->
  <link rel="stylesheet" href="/static/themes.css">
  <script>window.__JOB_HUNTER_DEBUG_MODE__ = __JOB_HUNTER_DEBUG_MODE__;</script>
  <script>window.__JOB_HUNTER_CSRF_TOKEN__ = "__JOB_HUNTER_CSRF_TOKEN__";</script>
  <script src="/static/csrf.js"></script>
  <script src="/static/console-bridge.js"></script>
  <script src="/static/theme-switcher.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    .ws-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 54px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 200;
    } 
    .ws-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .ws-brand-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .ws-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ws-test-panel {
      position: relative;
    }
    .ws-test-trigger {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    .ws-test-trigger:hover,
    .ws-test-trigger[aria-expanded="true"] {
      color: var(--text-primary);
    }
    .ws-test-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 196px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      box-shadow: var(--shadow-soft);
      display: none;
      z-index: 220;
    }
    .ws-test-menu.is-open {
      display: block;
    }
    .ws-test-menu-title {
      padding: 4px 8px 8px;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ws-test-menu-separator {
      height: 1px;
      margin: 0 4px 6px;
      background: var(--border-subtle);
    }
    .ws-test-action {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      background: transparent;
      color: var(--text-primary);
      font: inherit;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
    }
    .ws-test-action:hover {
      background: var(--bg-muted);
    }
    .ws-flash-mount {
      position: fixed;
      inset: 54px 0 0;
      z-index: 240;
      padding: 20px;
    }
    .ws-flash-backdrop {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--bg-page) 18%, transparent), color-mix(in srgb, var(--scrim) 90%, transparent)),
        color-mix(in srgb, var(--bg-page) 14%, transparent);
      backdrop-filter: blur(14px) saturate(0.9);
      -webkit-backdrop-filter: blur(14px) saturate(0.9);
    }
    .ws-flash-shell {
      position: relative;
      display: grid;
      place-items: start center;
      min-height: calc(100vh - 54px);
      padding-top: clamp(8px, 3.6vh, 32px);
    }
    .ws-flash-card {
      display: none;
      width: min(100%, 980px);
      margin: 0 auto;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--bg-surface) 92%, transparent), color-mix(in srgb, var(--bg-muted) 82%, transparent)),
        var(--bg-surface);
      border: 1px solid color-mix(in srgb, var(--border-subtle) 84%, transparent);
      border-radius: 24px;
      box-shadow: 0 26px 60px color-mix(in srgb, var(--text-primary) 16%, transparent);
      overflow: hidden;
    }
    .ws-flash-card.is-visible {
      display: block;
      animation: wsFlashCardIn 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ws-flash-body {
      display: grid;
      gap: 18px;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.78fr);
      padding: clamp(20px, 2.4vw, 28px);
    }
    .ws-flash-main {
      min-width: 0;
    }
    .ws-flash-title {
      margin: 0;
      font-size: clamp(2rem, 3vw, 2.6rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      color: var(--text-primary);
    }
    .ws-flash-subtitle {
      margin: 10px 0 0;
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.45;
      max-width: 44ch;
    }
    .ws-flash-helper {
      margin: 12px 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 52ch;
    }
    .ws-flash-footer {
      margin-top: 18px;
      padding: 11px 13px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--state-info-bg) 70%, transparent);
      border: 1px solid color-mix(in srgb, var(--state-info-border) 76%, transparent);
      color: var(--state-info-text);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .ws-flash-side {
      padding: 18px;
      border-radius: 20px;
      background: color-mix(in srgb, var(--bg-surface) 88%, transparent);
      border: 1px solid color-mix(in srgb, var(--border-subtle) 88%, transparent);
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .ws-flash-side h2 {
      margin: 0;
      font-size: 1.02rem;
      color: var(--text-primary);
    }
    .ws-flash-action-list {
      display: grid;
      gap: 10px;
    }
    .ws-flash-actions {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }
    .ws-flash-actions .btn {
      min-height: 42px;
      padding-inline: 14px;
      font-size: 0.9rem;
    }
    .ws-flash-actions .ws-flash-primary {
      grid-column: 1 / -1;
    }
    .ws-flash-optout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .ws-flash-optout input {
      margin: 0;
      accent-color: var(--accent);
    }
    body.ws-onboarding-active {
      overflow: hidden;
    }
    body.ws-wait-active {
      overflow: hidden;
    }
    @keyframes wsFlashCardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    /* Results mount */
    #results-mount { min-height: calc(100vh - 54px); }
    #results-loading {
      min-height: calc(100vh - 54px);
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text-muted);
    }
    #results-loading .wait-state {
      width: min(100%, 560px);
    }
    .ws-wait-mount {
      position: fixed;
      inset: 54px 0 0;
      z-index: 230;
      padding: 20px;
      display: grid;
      place-items: center;
    }
    .ws-wait-mount[hidden] {
      display: none;
    }
    .ws-wait-backdrop {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--bg-page) 18%, transparent), color-mix(in srgb, var(--scrim) 92%, transparent)),
        color-mix(in srgb, var(--bg-page) 14%, transparent);
      backdrop-filter: blur(14px) saturate(0.9);
      -webkit-backdrop-filter: blur(14px) saturate(0.9);
    }
    .ws-wait-shell {
      position: relative;
      width: min(100%, 620px);
    }
    .ws-wait-shell .wait-state {
      min-width: 0;
    }

    #results-mount .page { max-width: none !important; padding: 16px 22px 56px !important; }
    #results-mount .workspace-layout { display: grid !important; }
    @media (max-width: 900px) {
      .ws-flash-mount {
        padding: 14px;
      }
      .ws-flash-body {
        grid-template-columns: minmax(0, 1fr);
      }
      .ws-flash-actions {
        grid-template-columns: 1fr;
      }
      .ws-flash-actions .ws-flash-primary {
        grid-column: auto;
      }
    }
  </style>
</head>
<body data-test-mode="__JOB_HUNTER_DEBUG_MODE__">
  <header class="ws-header">
    <span class="ws-brand">
      <img src="/static/job_hunter_img.png" class="ws-brand-icon">
      <span>Job Hunter</span>
    </span>
    <div class="ws-header-actions">
      <div class="theme-switcher-widget">
        <span>Theme test:</span>
        <select id="theme_picker" aria-label="Select theme">
          <option value="soft-professional">Soft Professional</option>
          <option value="bold-aggressive">Bold Aggressive</option>
          <option value="dark-professional">Dark Professional</option>
        </select>
      </div>
      <div class="ws-test-panel" id="ws_test_panel" hidden>
        <button class="ws-test-trigger" id="ws_test_trigger" type="button" aria-haspopup="true" aria-expanded="false">&#128736; Test</button>
        <div class="ws-test-menu" id="ws_test_menu" role="menu" aria-label="Test actions">
          <div class="ws-test-menu-title">&#128736; Test</div>
          <div class="ws-test-menu-separator" aria-hidden="true"></div>
          <button class="ws-test-action" id="ws_reset_user_btn" type="button" role="menuitem">Reset User</button>
          <button class="ws-test-action" id="ws_reset_learning_btn" type="button" role="menuitem" style="color: var(--state-error-text);">Reset Learning (&#9888;)</button>
        </div>
      </div>
      <button class="btn btn-primary" id="ws_header_run_btn" type="button" style="font-size: 0.86rem; padding: 8px 16px;">&#9654; Run search</button>
      <a href="/settings" class="btn btn-secondary" aria-label="Open settings" title="Open settings" style="font-size: 1.15rem; padding: 8px 14px; line-height: 1;">&#9881;</a>
    </div>
  </header>
  <div class="ws-flash-mount" id="ws_flash_mount"></div>
  <div class="ws-wait-mount" id="ws_wait_mount" hidden></div>
  <div id="results-mount">
    <div id="results-loading">
      <div class="wait-state" role="status" aria-live="polite">
        <span class="wait-state__spinner" aria-hidden="true"></span>
        <p class="wait-state__title">Loading workspace</p>
        <p class="wait-state__copy">Fetching the latest search results.</p>
      </div>
    </div>
  </div>

  <script>
    const wsFlashMount = document.getElementById('ws_flash_mount');
    const wsWaitMount = document.getElementById('ws_wait_mount');
    const resultsMount = document.getElementById('results-mount');
    const wsTestPanel = document.getElementById('ws_test_panel');
    const wsTestTrigger = document.getElementById('ws_test_trigger');
    const wsTestMenu = document.getElementById('ws_test_menu');
    const wsResetUserBtn = document.getElementById('ws_reset_user_btn');
    const wsResetLearningBtn = document.getElementById('ws_reset_learning_btn');
    const ONBOARDING_WELCOME_KEY = 'jobHunter.onboardingWelcome';
    const ONBOARDING_WELCOME_OPT_OUT_KEY = 'jobHunter.onboardingWelcomeOptOut';
    const ONBOARDING_WIZARD_KEY = 'jobHunter.onboardingWizard';
    const ONBOARDING_KEYWORD_SPLIT_RE = /[,\n|/]+/;
    const RUN_STATUS_POLL_INTERVAL_MS = 1000;
    const RUN_STATUS_MAX_ATTEMPTS = 60;
    const isTestMode = document.body.dataset.testMode === 'true';
    let runStatusPollHandle = null;
    let workspaceWaitState = null;

    function setTestMenuOpen(open) {
      if (!wsTestMenu || !wsTestTrigger) {
        return;
      }
      wsTestMenu.classList.toggle('is-open', Boolean(open));
      wsTestTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function clearOnboardingBrowserState() {
      try {
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        window.sessionStorage.removeItem(ONBOARDING_WIZARD_KEY);
      } catch {}
      try {
        window.localStorage.removeItem(ONBOARDING_WELCOME_OPT_OUT_KEY);
      } catch {}
    }

    async function postTestAction(path) {
      const response = await jobHunterFetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || 'Request failed');
      }
      return payload;
    }

    function peekOnboardingWelcomeState() {
      try {
        const raw = window.sessionStorage.getItem(ONBOARDING_WELCOME_KEY);
        if (!raw) {
          return null;
        }
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch {
        return null;
      }
    }

    function consumeOnboardingWelcomeState() {
      try {
        const raw = window.sessionStorage.getItem(ONBOARDING_WELCOME_KEY);
        if (!raw) {
          return null;
        }
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch {
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        return null;
      }
    }

    function onboardingWelcomeOptedOut() {
      try {
        return window.localStorage.getItem(ONBOARDING_WELCOME_OPT_OUT_KEY) === '1';
      } catch {
        return false;
      }
    }

    function setOnboardingWelcomeOptOut(enabled) {
      try {
        if (enabled) {
          window.localStorage.setItem(ONBOARDING_WELCOME_OPT_OUT_KEY, '1');
        } else {
          window.localStorage.removeItem(ONBOARDING_WELCOME_OPT_OUT_KEY);
        }
      } catch {
        // Ignore storage errors in private mode or locked-down environments.
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderWorkspaceWait(state) {
      if (!wsWaitMount) {
        return;
      }
      if (!state) {
        wsWaitMount.innerHTML = '';
        wsWaitMount.hidden = true;
        document.body.classList.remove('ws-wait-active');
        return;
      }
      const nextState = {
        title: String(state.title || 'Working').trim() || 'Working',
        copy: String(state.copy || '').trim(),
        subcopy: String(state.subcopy || '').trim(),
      };
      if (
        workspaceWaitState
        && workspaceWaitState.title === nextState.title
        && workspaceWaitState.copy === nextState.copy
        && workspaceWaitState.subcopy === nextState.subcopy
      ) {
        return;
      }
      workspaceWaitState = { ...nextState };
      const title = escapeHtml(nextState.title);
      const copy = escapeHtml(nextState.copy);
      const subcopy = nextState.subcopy;
      wsWaitMount.hidden = false;
      document.body.classList.add('ws-wait-active');
      wsWaitMount.innerHTML = `
        <div class="ws-wait-backdrop" aria-hidden="true"></div>
        <div class="ws-wait-shell">
          <div class="wait-state" role="status" aria-live="polite">
            <span class="wait-state__spinner" aria-hidden="true"></span>
            <p class="wait-state__title">${title}</p>
            ${copy ? `<p class="wait-state__copy">${copy}</p>` : ''}
            ${subcopy ? `<p class="wait-state__subcopy">${escapeHtml(subcopy)}</p>` : ''}
          </div>
        </div>
      `;
    }

    function showWorkspaceWait(state) {
      if (!state || typeof state !== 'object') {
        workspaceWaitState = null;
        renderWorkspaceWait(null);
        return;
      }
      renderWorkspaceWait(state);
    }

    function updateWorkspaceWait(patch) {
      if (!workspaceWaitState) {
        return;
      }
      renderWorkspaceWait({ ...workspaceWaitState, ...patch });
    }

    function hideWorkspaceWait() {
      workspaceWaitState = null;
      renderWorkspaceWait(null);
    }

    function setOnboardingOverlayVisible(visible) {
      document.body.classList.toggle('ws-onboarding-active', Boolean(visible));
    }

    function splitOnboardingSummary(value) {
      return String(value || '')
        .split(ONBOARDING_KEYWORD_SPLIT_RE)
        .map((part) => String(part || '').trim())
        .filter(Boolean);
    }

    function buildOnboardingFooterSummary(state) {
      const titles = splitOnboardingSummary(state?.search_keywords).slice(0, 3);
      const locations = Array.isArray(state?.search_locations)
        ? state.search_locations.map((value) => String(value || '').trim()).filter(Boolean)
        : [];
      const parts = [...titles, ...locations.slice(0, 1)];
      return parts.length ? parts.join(' · ') : 'Your saved search is ready.';
    }

    function dismissOnboardingOverlay() {
      if (!wsFlashMount) {
        return;
      }
      wsFlashMount.innerHTML = '';
      setOnboardingOverlayVisible(false);
    }

    function updateResultsLoadingMessage(message) {
      const loading = document.getElementById('results-loading');
      if (loading) {
        const text = escapeHtml(String(message || 'Loading workspace'));
        loading.innerHTML = `
          <div class="wait-state" role="status" aria-live="polite">
            <span class="wait-state__spinner" aria-hidden="true"></span>
            <p class="wait-state__title">Loading workspace</p>
            <p class="wait-state__copy">${text}</p>
          </div>
        `;
      }
    }

    function stopRunStatusPolling() {
      if (runStatusPollHandle) {
        window.clearInterval(runStatusPollHandle);
        runStatusPollHandle = null;
      }
    }

    function startRunStatusPolling() {
      if (runStatusPollHandle) {
        return;
      }
      runStatusPollHandle = window.setInterval(syncWorkspaceRunStatus, RUN_STATUS_POLL_INTERVAL_MS);
    }

    async function syncWorkspaceRunStatus() {
      try {
        const response = await jobHunterFetch('/api/run-status', { method: 'GET' });
        if (!response.ok) {
          throw new Error('Could not check run status.');
        }
        const payload = await response.json().catch(() => ({}));
        if (payload?.status === 'running') {
          showWorkspaceWait({
            title: 'Search in progress',
            copy: 'Job Hunter is checking sources and ranking matches.',
            subcopy: 'Keep this tab open. The workspace will refresh when the run finishes.',
          });
          startRunStatusPolling();
          return true;
        }
        stopRunStatusPolling();
        if (workspaceWaitState) {
          hideWorkspaceWait();
          await loadResults();
        }
        return false;
      } catch {
        return false;
      }
    }

    async function startWorkspaceRunFromOverlay() {
      showWorkspaceWait({
        title: 'Starting search',
        copy: 'Saving your settings and beginning the scrape.',
        subcopy: 'The workspace will refresh automatically while the search runs.',
      });
      try {
        const response = await jobHunterFetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'Could not start search.');
        }
        showWorkspaceWait({
          title: 'Search in progress',
          copy: 'Job Hunter is checking sources and ranking matches.',
          subcopy: 'Keep this tab open. The workspace will refresh when the run finishes.',
        });
        startRunStatusPolling();
        pollRunStatusAfterOverlayStart();
      } catch (error) {
        hideWorkspaceWait();
        updateResultsLoadingMessage('Could not start search. Refresh the page and try again.');
        window.alert(error.message || 'Could not start search.');
      }
    }

    async function pollRunStatusAfterOverlayStart(attempt = 0) {
      try {
        const response = await jobHunterFetch('/api/run-status', { method: 'GET' });
        if (!response.ok) {
          throw new Error('Could not check run status.');
        }
        const payload = await response.json().catch(() => ({}));
        if (payload?.status === 'running' && attempt < RUN_STATUS_MAX_ATTEMPTS) {
          updateWorkspaceWait({
            title: 'Search in progress',
            copy: 'Job Hunter is still working.',
            subcopy: 'The workspace will refresh when the run is finished.',
          });
          window.setTimeout(() => pollRunStatusAfterOverlayStart(attempt + 1), RUN_STATUS_POLL_INTERVAL_MS);
          return;
        }
        updateWorkspaceWait({
          title: 'Refreshing results',
          copy: 'Loading the latest workspace now.',
        });
        await loadResults();
        hideWorkspaceWait();
      } catch (error) {
        if (attempt < RUN_STATUS_MAX_ATTEMPTS) {
          window.setTimeout(() => pollRunStatusAfterOverlayStart(attempt + 1), RUN_STATUS_POLL_INTERVAL_MS);
          return;
        }
        hideWorkspaceWait();
        updateResultsLoadingMessage('Could not refresh results. Refresh the page if needed.');
      }
    }

    function renderOnboardingWelcome() {
      if (!wsFlashMount) {
        return;
      }
      const state = peekOnboardingWelcomeState();
      if (!state || onboardingWelcomeOptedOut()) {
        dismissOnboardingOverlay();
        return;
      }

      setOnboardingOverlayVisible(true);
      const nextSearchSummary = escapeHtml(buildOnboardingFooterSummary(state));
      const profileSourceCopy = state.kind === 'profile-refresh'
        ? 'We rebuilt this from your latest CV.'
        : 'We built this from your CV.';

      wsFlashMount.innerHTML = `
        <div class="ws-flash-backdrop" data-onboarding-backdrop></div>
        <div class="ws-flash-shell">
          <section class="ws-flash-card is-visible" role="dialog" aria-modal="true" aria-label="Onboarding summary">
            <div class="ws-flash-body">
              <div class="ws-flash-main">
                <h1 class="ws-flash-title">Welcome back</h1>
                <p class="ws-flash-subtitle">Your AI job search workspace is ready.</p>
                <p class="ws-flash-helper">${profileSourceCopy} We prepared your first search settings so you can start from here.</p>
                <div class="ws-flash-footer">Next search: ${nextSearchSummary}</div>
              </div>
              <aside class="ws-flash-side">
                <h2>Quick start</h2>
                <div class="ws-flash-action-list">
                  <button class="btn btn-primary ws-flash-primary" id="ws_flash_run_search" type="button">Run search</button>
                  <div class="ws-flash-actions">
                    <button class="btn btn-secondary" id="ws_flash_dismiss" type="button">Dismiss</button>
                    <a href="/settings" class="btn btn-secondary">Open settings</a>
                  </div>
                </div>
                <label class="ws-flash-optout" for="ws_flash_opt_out">
                  <input type="checkbox" id="ws_flash_opt_out">
                  <span>Do not show again</span>
                </label>
              </aside>
            </div>
          </section>
        </div>
      `;

      const backdrop = wsFlashMount.querySelector('[data-onboarding-backdrop]');
      const dismissButton = document.getElementById('ws_flash_dismiss');
      const runSearchButton = document.getElementById('ws_flash_run_search');
      const settingsButton = wsFlashMount.querySelector('a[href="/settings"]');
      const optOut = document.getElementById('ws_flash_opt_out');
      if (optOut) {
        optOut.checked = onboardingWelcomeOptedOut();
      }
      const closeFlash = () => {
        if (optOut) {
          setOnboardingWelcomeOptOut(optOut.checked);
        }
        consumeOnboardingWelcomeState();
        dismissOnboardingOverlay();
      };
      const closeAndRunSearch = () => {
        closeFlash();
        startWorkspaceRunFromOverlay();
      };
      if (backdrop) {
        backdrop.addEventListener('click', closeFlash);
      }
      if (dismissButton) {
        dismissButton.addEventListener('click', closeFlash);
      }
      if (runSearchButton) {
        runSearchButton.addEventListener('click', closeAndRunSearch);
      }
      if (settingsButton) {
        settingsButton.addEventListener('click', closeFlash);
      }
    }

if (isTestMode && wsTestPanel && wsTestTrigger && wsTestMenu) {
      wsTestPanel.hidden = false;

      wsTestTrigger.addEventListener('click', () => {
        setTestMenuOpen(!wsTestMenu.classList.contains('is-open'));
      });

      document.addEventListener('click', (event) => {
        if (!wsTestPanel.contains(event.target)) {
          setTestMenuOpen(false);
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          setTestMenuOpen(false);
        }
      });

      document.getElementById('ws_header_run_btn')?.addEventListener('click', () => {
        startWorkspaceRunFromOverlay();
      });

      wsResetUserBtn?.addEventListener('click', async () => {
        const confirmed = window.confirm(
          'Reset current user?\n\n'
          + 'This clears the current profile, onboarding state, uploaded CV state, local review feedback, and job history.\n\n'
          + 'Shared learned signals will be preserved.'
        );
        if (!confirmed) {
          return;
        }
        try {
          setTestMenuOpen(false);
          const payload = await postTestAction('/api/test/reset-user');
          clearOnboardingBrowserState();
          window.location.href = payload.redirect_to || '/start';
        } catch (error) {
          window.alert(error.message || 'Could not reset current user.');
        }
      });

      wsResetLearningBtn?.addEventListener('click', async () => {
        const confirmed = window.confirm(
          'Reset global learning?\n\n'
          + 'This wipes the shared learned signal memory for every test user.\n\n'
          + 'This is dangerous and cannot be undone.'
        );
        if (!confirmed) {
          return;
        }
        try {
          setTestMenuOpen(false);
          const payload = await postTestAction('/api/test/reset-learning');
          window.alert(payload.message || 'Global learning reset.');
        } catch (error) {
          window.alert(error.message || 'Could not reset global learning.');
        }
      });
    }

    async function loadResults() {
      try {
        const resp = await jobHunterFetch('/api/results-html');
        if (!resp.ok) {
          const runStats = await jobHunterFetch('/api/run-stats').then(r => r.ok ? r.json() : {}).catch(() => ({}));
          const lastError = runStats.last_run_error;
          if (lastError) {
            resultsMount.innerHTML = `<div style="padding:40px 24px;text-align:center;">
              <div style="display:inline-block;max-width:600px;background:var(--state-error-bg,#3a1a1a);border:1px solid var(--state-error-border,#a33);border-radius:8px;padding:24px 28px;color:var(--state-error-text,#f88);text-align:left;">
                <strong style="display:block;margin-bottom:8px;">Last search failed</strong>
                <code style="font-size:0.82em;word-break:break-all;">${lastError.replace(/</g,'&lt;')}</code>
              </div>
              <div style="margin-top:20px;color:var(--text-muted);">Fix the issue above and run the search again.</div>
            </div>`;
          } else {
            resultsMount.innerHTML = '<div style="padding:64px 24px;color:var(--text-muted);text-align:center;">No results yet — run a search first.</div>';
          }
          return;
        }
        const html = await resp.text();
        resultsMount.innerHTML = '';
        const range = document.createRange();
        const frag = range.createContextualFragment(html);
        resultsMount.appendChild(frag);
      } catch {
        resultsMount.innerHTML = '<div style="padding:64px 24px;color:var(--text-muted);text-align:center;">Could not load results. Try refreshing the page.</div>';
      }
    }

    (async () => {
      renderOnboardingWelcome();
      await syncWorkspaceRunStatus();
      await loadResults();
    })();
  </script>
</body>
</html>
