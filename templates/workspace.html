<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Hunter</title>
  <link rel="stylesheet" href="/static/themes.css">
  <script src="/static/theme-switcher.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    @keyframes wsSpin { to { transform: rotate(360deg); } }
    body { 
      margin: 0; 
      font-family: "Segoe UI", Arial, sans-serif; 
      background: #0B0C10; /* Deep Charcoal */
      color: #FFFFFF;
    }

    .ws-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 54px;
      background: #0B0C10;
      border-bottom: 1px solid #1F2128;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .ws-brand {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .ws-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ws-run-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 14px;
      margin-left: 4px;
      border-left: 1px solid var(--border-subtle);
    }
    .ws-last-run {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    @keyframes wsRunPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .ws-run-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 22px;
      background: rgba(245, 128, 32, 0.08);
      border-bottom: 1px solid rgba(245, 128, 32, 0.2);
      font-size: 0.84rem;
      color: #F58020;
      font-weight: 600;
    }
    .ws-run-indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F58020;
      animation: wsRunPulse 1.2s ease-in-out infinite;
      flex: 0 0 auto;
    }
    .ws-test-panel {
      position: relative;
    }
    .ws-test-trigger {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    .ws-test-trigger:hover,
    .ws-test-trigger[aria-expanded="true"] {
      color: var(--text-primary);
    }
    .ws-test-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 196px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      box-shadow: 0 18px 40px rgba(12, 18, 28, 0.18);
      display: none;
      z-index: 220;
    }
    .ws-test-menu.is-open {
      display: block;
    }
    .ws-test-menu-title {
      padding: 4px 8px 8px;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ws-test-menu-separator {
      height: 1px;
      margin: 0 4px 6px;
      background: var(--border-subtle);
    }
    .ws-test-action {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      background: transparent;
      color: var(--text-primary);
      font: inherit;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
    }
    .ws-test-action:hover {
      background: var(--bg-muted);
    }
    .ws-test-action-danger {
      color: #b42318;
    }
    .ws-btn {
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: opacity 120ms;
    }
    .ws-btn-primary {
      background: #F58020; /* Logo Orange */
      color: #FFFFFF !important;
      border-color: #F58020;
    }
    .ws-btn-secondary {
      background: var(--bg-surface);
      color: var(--accent-2) !important;
    }
    .ws-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .ws-btn.is-working::before {
      content: "";
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 999px;
      animation: wsSpin 0.9s linear infinite;
      opacity: 0.55;
      flex: 0 0 auto;
    }
.ws-flash-mount {
      padding: 16px 22px 0;
    }
    .ws-flash-card {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      background:
        radial-gradient(circle at top left, rgba(20, 83, 45, 0.16), transparent 32%),
        linear-gradient(135deg, #fff8ee 0%, #fffdfa 58%, #eef6ff 100%);
      border: 1px solid #e4d4bf;
      border-radius: 26px;
      box-shadow: 0 24px 58px rgba(24, 34, 49, 0.12);
      overflow: hidden;
    }
    .ws-flash-card.is-visible {
      display: block;
      animation: wsFlashCardIn 480ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ws-flash-body {
      display: grid;
      gap: 22px;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.95fr);
      padding: 26px;
    }
    .ws-flash-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #14532d;
    }
    .ws-flash-title {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: #182231;
    }
    .ws-flash-copy {
      margin: 0;
      color: #495466;
      line-height: 1.65;
      font-size: 1rem;
    }
    .ws-flash-subcopy {
      margin-top: 10px;
      color: #5f6b7b;
      line-height: 1.6;
      font-size: 0.94rem;
    }
    .ws-flash-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .ws-flash-step {
      opacity: 0;
      padding: 14px 14px 15px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(219, 206, 188, 0.95);
      transform: translateY(10px);
      animation: wsFlashItemIn 520ms ease forwards;
    }
    .ws-flash-step:nth-child(2) {
      animation-delay: 70ms;
    }
    .ws-flash-step:nth-child(3) {
      animation-delay: 140ms;
    }
    .ws-flash-step-title {
      margin: 0 0 6px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #182231;
    }
    .ws-flash-step-copy {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #5b6470;
    }
    .ws-flash-note {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(219, 206, 188, 0.95);
      color: #425064;
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .ws-flash-side {
      padding: 20px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(223, 209, 189, 0.96);
    }
    .ws-flash-side h2 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      color: #182231;
    }
    .ws-flash-side p {
      margin: 0 0 12px;
      color: #5b6470;
      line-height: 1.6;
      font-size: 0.93rem;
    }
    .ws-flash-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .ws-flash-dismiss {
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #d6c7af;
      background: #fffdf9;
      color: #29435c;
    }
    .ws-flash-optout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      color: #5b6470;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .ws-flash-optout input {
      margin: 0;
      accent-color: #14532d;
    }
    @keyframes wsFlashCardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes wsFlashItemIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Results mount */
    #results-mount { min-height: calc(100vh - 54px); }
    #results-loading {
      padding: 64px 24px;
      color: #667085;
      text-align: center;
      font-size: 0.95rem;
    }

    #results-mount .page { max-width: none !important; padding: 16px 22px 56px !important; }
    #results-mount .dashboard-layout { display: grid !important; }
    @media (max-width: 900px) {
      .ws-flash-body {
        grid-template-columns: minmax(0, 1fr);
      }
      .ws-flash-steps {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body data-test-mode="__JOB_HUNTER_TEST_MODE__">
  <header class="ws-header">
    <span class="ws-brand">Job Hunter</span>
    <div class="ws-header-actions">
      <div class="theme-switcher-widget">
        <span>Theme test:</span>
        <select id="theme_picker" aria-label="Select theme">
          <option value="soft-professional">Soft Professional</option>
          <option value="bold-aggressive">Bold Aggressive</option>
          <option value="dark-professional">Dark Professional</option>
        </select>
      </div>
      <div class="ws-test-panel" id="ws_test_panel" hidden>
        <button class="ws-test-trigger" id="ws_test_trigger" type="button" aria-haspopup="true" aria-expanded="false">&#128736; Test</button>
        <div class="ws-test-menu" id="ws_test_menu" role="menu" aria-label="Test actions">
          <div class="ws-test-menu-title">&#128736; Test</div>
          <div class="ws-test-menu-separator" aria-hidden="true"></div>
          <button class="ws-test-action" id="ws_reset_user_btn" type="button" role="menuitem">Reset User</button>
          <button class="ws-test-action ws-test-action-danger" id="ws_reset_learning_btn" type="button" role="menuitem">Reset Learning (&#9888;)</button>
        </div>
      </div>
      <a href="/settings" class="ws-btn ws-btn-secondary">&#9881; Settings</a>
      <div class="ws-run-group">
        <span class="ws-last-run" id="ws_last_run" hidden></span>
        <button class="ws-btn ws-btn-primary" id="ws_run_btn" type="button">&#9654; Run Search</button>
      </div>
    </div>
  </header>
  <div class="ws-run-indicator" id="ws_run_indicator" hidden>
    <span class="ws-run-indicator-dot"></span>
    Search is running &mdash; this can take a few minutes. Results will appear automatically when done.
  </div>
  <div class="ws-flash-mount" id="ws_flash_mount"></div>
  <div id="results-mount">
    <div id="results-loading">Loading results...</div>
  </div>

  <script>
    const wsRunBtn = document.getElementById('ws_run_btn');
    const wsFlashMount = document.getElementById('ws_flash_mount');
    const resultsMount = document.getElementById('results-mount');
    const wsTestPanel = document.getElementById('ws_test_panel');
    const wsTestTrigger = document.getElementById('ws_test_trigger');
    const wsTestMenu = document.getElementById('ws_test_menu');
    const wsResetUserBtn = document.getElementById('ws_reset_user_btn');
    const wsResetLearningBtn = document.getElementById('ws_reset_learning_btn');
    const ONBOARDING_WELCOME_KEY = 'jobHunter.onboardingWelcome';
    const ONBOARDING_WELCOME_OPT_OUT_KEY = 'jobHunter.onboardingWelcomeOptOut';
    const ONBOARDING_WIZARD_KEY = 'jobHunter.onboardingWizard';
    const isTestMode = document.body.dataset.testMode === 'true';
    let runPollHandle = null;
    const wsRunIndicator = document.getElementById('ws_run_indicator');
    const wsLastRun = document.getElementById('ws_last_run');

    function setTestMenuOpen(open) {
      if (!wsTestMenu || !wsTestTrigger) {
        return;
      }
      wsTestMenu.classList.toggle('is-open', Boolean(open));
      wsTestTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function clearOnboardingBrowserState() {
      try {
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        window.sessionStorage.removeItem(ONBOARDING_WIZARD_KEY);
      } catch {}
      try {
        window.localStorage.removeItem(ONBOARDING_WELCOME_OPT_OUT_KEY);
      } catch {}
    }

    async function postTestAction(path) {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || 'Request failed');
      }
      return payload;
    }

    function consumeOnboardingWelcomeState() {
      try {
        const raw = window.sessionStorage.getItem(ONBOARDING_WELCOME_KEY);
        if (!raw) {
          return null;
        }
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch {
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        return null;
      }
    }

    function onboardingWelcomeOptedOut() {
      try {
        return window.localStorage.getItem(ONBOARDING_WELCOME_OPT_OUT_KEY) === '1';
      } catch {
        return false;
      }
    }

    function setOnboardingWelcomeOptOut(enabled) {
      try {
        if (enabled) {
          window.localStorage.setItem(ONBOARDING_WELCOME_OPT_OUT_KEY, '1');
        } else {
          window.localStorage.removeItem(ONBOARDING_WELCOME_OPT_OUT_KEY);
        }
      } catch {
        // Ignore storage errors in private mode or locked-down environments.
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderOnboardingWelcome() {
      if (!wsFlashMount) {
        return;
      }
      const state = consumeOnboardingWelcomeState();
      if (!state || onboardingWelcomeOptedOut()) {
        wsFlashMount.innerHTML = '';
        return;
      }

      const keyword = String(state.search_keywords || '').trim();
      const locations = Array.isArray(state.search_locations)
        ? state.search_locations.map((value) => String(value || '').trim()).filter(Boolean)
        : [];
      const searchSummary = [];
      if (keyword) {
        searchSummary.push(`keyword "${escapeHtml(keyword)}"`);
      }
      if (locations.length) {
        searchSummary.push(`locations ${escapeHtml(locations.join(', '))}`);
      }
      const title = state.kind === 'profile-refresh'
        ? 'Profile refreshed. This is your dashboard.'
        : 'Welcome. This is your dashboard.';
      const introCopy = state.kind === 'profile-refresh'
        ? 'We refreshed your profile from your latest CV. Your shortlist lives here, and the next search will use the updated profile automatically.'
        : 'We built your starting profile from your CV. This is where your shortlist appears and where new matches land after each search.';
      const subCopy = 'You should not need to know anything about internal files or extraction rules here. The important part is simple: review roles below, run another search when you want fresh results, and open Settings if you want to tune how matching works.';
      const searchNote = searchSummary.length
        ? `<div class="ws-flash-note">Your next search will use ${searchSummary.join(' and ')}.</div>`
        : '';

      wsFlashMount.innerHTML = `
        <section class="ws-flash-card is-visible" aria-label="Onboarding summary">
          <div class="ws-flash-body">
            <div>
              <div class="ws-flash-eyebrow">Welcome to Job Hunter</div>
              <h1 class="ws-flash-title">${title}</h1>
              <p class="ws-flash-copy">${introCopy}</p>
              <p class="ws-flash-subcopy">${subCopy}</p>
              <div class="ws-flash-steps">
                <div class="ws-flash-step">
                  <p class="ws-flash-step-title">1. Review the shortlist</p>
                  <p class="ws-flash-step-copy">The roles below are your current shortlist. Open any card to inspect it and decide what is worth your time.</p>
                </div>
                <div class="ws-flash-step">
                  <p class="ws-flash-step-title">2. Run a search when ready</p>
                  <p class="ws-flash-step-copy">Use the <strong>Run Search</strong> button in the top bar to fetch fresh roles. It can take a few minutes, and this dashboard will refresh when the run finishes.</p>
                </div>
                <div class="ws-flash-step">
                  <p class="ws-flash-step-title">3. Schedule or tune things in Settings</p>
                  <p class="ws-flash-step-copy">If you want hands-off searching, set a daily schedule there. You can also adjust titles, locations, salary, and other matching preferences.</p>
                </div>
              </div>
              ${searchNote}
            </div>
            <aside class="ws-flash-side">
              <h2>Quick start</h2>
              <p>This intro is just a handoff so you know where you are. Once dismissed, the dashboard below becomes the main thing you work from.</p>
              <p>If you already have saved roles, browse them now. If not, use the top-bar run button and wait here while the dashboard refreshes with fresh matches. If you prefer, you can set a daily schedule instead.</p>
              <div class="ws-flash-actions">
                <a href="/settings#schedule-panel" class="ws-btn ws-btn-secondary">Set Daily Schedule</a>
                <a href="/settings" class="ws-btn ws-btn-secondary">Open Settings</a>
                <button class="ws-flash-dismiss" id="ws_flash_dismiss" type="button">Got it</button>
              </div>
              <label class="ws-flash-optout" for="ws_flash_opt_out">
                <input type="checkbox" id="ws_flash_opt_out">
                <span>Do not show this intro again</span>
              </label>
            </aside>
          </div>
        </section>
      `;

      const dismissButton = document.getElementById('ws_flash_dismiss');
      const optOut = document.getElementById('ws_flash_opt_out');
      if (optOut) {
        optOut.checked = onboardingWelcomeOptedOut();
      }
      const closeFlash = () => {
        if (optOut) {
          setOnboardingWelcomeOptOut(optOut.checked);
        }
        wsFlashMount.innerHTML = '';
      };
      if (dismissButton) {
        dismissButton.addEventListener('click', closeFlash);
      }
    }

if (isTestMode && wsTestPanel && wsTestTrigger && wsTestMenu) {
      wsTestPanel.hidden = false;

      wsTestTrigger.addEventListener('click', () => {
        setTestMenuOpen(!wsTestMenu.classList.contains('is-open'));
      });

      document.addEventListener('click', (event) => {
        if (!wsTestPanel.contains(event.target)) {
          setTestMenuOpen(false);
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          setTestMenuOpen(false);
        }
      });

      wsResetUserBtn?.addEventListener('click', async () => {
        const confirmed = window.confirm(
          'Reset current user?\n\n'
          + 'This clears the current profile, onboarding state, uploaded CV state, local review feedback, and job history.\n\n'
          + 'Shared learned signals will be preserved.'
        );
        if (!confirmed) {
          return;
        }
        try {
          setTestMenuOpen(false);
          const payload = await postTestAction('/api/test/reset-user');
          clearOnboardingBrowserState();
          window.location.href = payload.redirect_to || '/start';
        } catch (error) {
          window.alert(error.message || 'Could not reset current user.');
        }
      });

      wsResetLearningBtn?.addEventListener('click', async () => {
        const confirmed = window.confirm(
          'Reset global learning?\n\n'
          + 'This wipes the shared learned signal memory for every test user.\n\n'
          + 'This is dangerous and cannot be undone.'
        );
        if (!confirmed) {
          return;
        }
        try {
          setTestMenuOpen(false);
          const payload = await postTestAction('/api/test/reset-learning');
          window.alert(payload.message || 'Global learning reset.');
        } catch (error) {
          window.alert(error.message || 'Could not reset global learning.');
        }
      });
    }

    async function getRunStats() {
      try {
        const resp = await fetch('/api/run-stats');
        if (!resp.ok) return null;
        return await resp.json();
      } catch {
        return null;
      }
    }

    function formatLastRun(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        return 'Last run: ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          + ' \u00b7 ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
      } catch {
        return 'Last run: ' + isoStr;
      }
    }

    function setRunningState(running) {
      if (running) {
        wsRunBtn.disabled = true;
        wsRunBtn.classList.add('is-working');
        wsRunBtn.textContent = 'Searching\u2026';
        if (wsRunIndicator) wsRunIndicator.hidden = false;
      } else {
        wsRunBtn.disabled = false;
        wsRunBtn.classList.remove('is-working');
        wsRunBtn.textContent = '\u25b6 Run Search';
        if (wsRunIndicator) wsRunIndicator.hidden = true;
      }
    }

    function updateLastRun(isoStr) {
      if (!wsLastRun) return;
      if (isoStr) {
        wsLastRun.textContent = formatLastRun(isoStr);
        wsLastRun.hidden = false;
      } else {
        wsLastRun.hidden = true;
      }
    }

    function startRunPolling(prevFinishedAt) {
      if (runPollHandle) return;
      runPollHandle = setInterval(async () => {
        const stats = await getRunStats();
        const finishedAt = stats && stats.run_finished_at;
        if (finishedAt && finishedAt !== prevFinishedAt) {
          clearInterval(runPollHandle);
          runPollHandle = null;
          setRunningState(false);
          updateLastRun(finishedAt);
          await loadResults();
        }
      }, 5000);
    }

    async function loadResults() {
      try {
        const resp = await fetch('/api/results-html');
        if (!resp.ok) {
          resultsMount.innerHTML = '<div style="padding:64px 24px;color:#667085;text-align:center;">Run a search first to see results.</div>';
          return;
        }
        const html = await resp.text();
        resultsMount.innerHTML = '';
        const range = document.createRange();
        const frag = range.createContextualFragment(html);
        resultsMount.appendChild(frag);
      } catch {
        resultsMount.innerHTML = '<div style="padding:64px 24px;color:#667085;text-align:center;">Could not load results. Try refreshing the page.</div>';
      }
    }

    wsRunBtn.addEventListener('click', async () => {
      if (runPollHandle) return;
      setRunningState(true);
      try {
        const stats = await getRunStats();
        const prevFinishedAt = stats && stats.run_finished_at;
        const resp = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || 'Failed to start run');
        startRunPolling(prevFinishedAt);
      } catch {
        setRunningState(false);
      }
    });

    (async () => {
      renderOnboardingWelcome();
      const stats = await getRunStats();
      if (stats && stats.run_finished_at) {
        updateLastRun(stats.run_finished_at);
      }
      await loadResults();
    })();
  </script>
</body>
</html>
