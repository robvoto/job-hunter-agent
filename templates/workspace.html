<!doctype html>
<html lang="en">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
  <span class="ws-brand">
  <img src="/static/job_hunter_img.png" alt="" class="ws-brand-icon">
  <span>Job Hunter</span>
</span-->
  <link rel="stylesheet" href="/static/themes.css">
  <script src="/static/theme-switcher.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    .ws-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 54px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 200;
    } 
    .ws-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .ws-brand-icon {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .ws-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .ws-test-panel {
      position: relative;
    }
    .ws-test-trigger {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--text-muted);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
    .ws-test-trigger:hover,
    .ws-test-trigger[aria-expanded="true"] {
      color: var(--text-primary);
    }
    .ws-test-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 196px;
      padding: 8px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      box-shadow: var(--shadow-soft);
      display: none;
      z-index: 220;
    }
    .ws-test-menu.is-open {
      display: block;
    }
    .ws-test-menu-title {
      padding: 4px 8px 8px;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .ws-test-menu-separator {
      height: 1px;
      margin: 0 4px 6px;
      background: var(--border-subtle);
    }
    .ws-test-action {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      background: transparent;
      color: var(--text-primary);
      font: inherit;
      font-size: 0.88rem;
      text-align: left;
      cursor: pointer;
    }
    .ws-test-action:hover {
      background: var(--bg-muted);
    }
.ws-flash-mount {
      padding: 16px 22px 0;
    }
    .ws-flash-card {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
      background: 
        radial-gradient(circle at top left, var(--state-success-bg), transparent 32%),
        var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 26px;
    box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .ws-flash-card.is-visible {
      display: block;
      animation: wsFlashCardIn 480ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .ws-flash-body {
      display: grid;
      gap: 22px;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.95fr);
      padding: 26px;
    }
    .ws-flash-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--state-success-text);
    }
    .ws-flash-title {
      margin: 0 0 12px;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text-primary);
    }
    .ws-flash-copy {
      color: var(--text-muted);
      line-height: 1.65;
      font-size: 1rem;
    }
    .ws-flash-subcopy {
      margin-top: 10px;
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.94rem;
    }
    .ws-flash-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .ws-flash-step {
      opacity: 0;
      padding: 14px 14px 15px;
      border-radius: 18px;
      background: var(--bg-muted);
      border: 1px solid var(--border-subtle);
      transform: translateY(10px);
      animation: wsFlashItemIn 520ms ease forwards;
    }
    .ws-flash-step:nth-child(2) {
      animation-delay: 70ms;
    }
    .ws-flash-step:nth-child(3) {
      animation-delay: 140ms;
    }
    .ws-flash-step-title {
      margin: 0 0 6px;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .ws-flash-step-copy {
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--text-muted);
    }
    .ws-flash-note {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--state-info-bg);
      border: 1px solid var(--state-info-border);
      color: var(--state-info-text);
      font-size: 0.9rem;
      line-height: 1.55;
    }
    .ws-flash-side {
      padding: 20px;
      border-radius: 22px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
    }
    .ws-flash-side h2 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      color: var(--text-primary);
    }
    .ws-flash-side p {
      margin: 0 0 12px;
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.93rem;
    }
    .ws-flash-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }
    .ws-flash-optout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .ws-flash-optout input {
      margin: 0;
      accent-color: var(--accent);
    }
    @keyframes wsFlashCardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes wsFlashItemIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Results mount */
    #results-mount { min-height: calc(100vh - 54px); }
    #results-loading {
      padding: 64px 24px;
      color: var(--text-muted);
      text-align: center;
      font-size: 0.95rem;
    }

    #results-mount .page { max-width: none !important; padding: 16px 22px 56px !important; }
    #results-mount .dashboard-layout { display: grid !important; }
    @media (max-width: 900px) {
      .ws-flash-body {
        grid-template-columns: minmax(0, 1fr);
      }
      .ws-flash-steps {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body data-test-mode="__JOB_HUNTER_DEBUG_MODE__">
  <header class="ws-header">
    <span class="ws-brand">
      <img src="/static/job_hunter_img.png" class="ws-brand-icon">
      <span>Job Hunter</span>
    </span>
    <div class="ws-header-actions">
      <div class="theme-switcher-widget">
        <span>Theme test:</span>
        <select id="theme_picker" aria-label="Select theme">
          <option value="soft-professional">Soft Professional</option>
          <option value="bold-aggressive">Bold Aggressive</option>
          <option value="dark-professional">Dark Professional</option>
        </select>
      </div>
      <div class="ws-test-panel" id="ws_test_panel" hidden>
        <button class="ws-test-trigger" id="ws_test_trigger" type="button" aria-haspopup="true" aria-expanded="false">&#128736; Test</button>
        <div class="ws-test-menu" id="ws_test_menu" role="menu" aria-label="Test actions">
          <div class="ws-test-menu-title">&#128736; Test</div>
          <div class="ws-test-menu-separator" aria-hidden="true"></div>
          <button class="ws-test-action" id="ws_reset_user_btn" type="button" role="menuitem">Reset User</button>
          <button class="ws-test-action" id="ws_reset_learning_btn" type="button" role="menuitem" style="color: var(--state-error-text);">Reset Learning (&#9888;)</button>
        </div>
      </div>
      <a href="/settings" class="btn btn-secondary" style="font-size: 0.86rem; padding: 8px 16px;">&#9881; Settings</a>
    </div>
  </header>
  <div class="ws-flash-mount" id="ws_flash_mount"></div>
  <div id="results-mount">
    <div id="results-loading">Loading results...</div>
  </div>

  <script>
    const wsFlashMount = document.getElementById('ws_flash_mount');
    const resultsMount = document.getElementById('results-mount');
    const wsTestPanel = document.getElementById('ws_test_panel');
    const wsTestTrigger = document.getElementById('ws_test_trigger');
    const wsTestMenu = document.getElementById('ws_test_menu');
    const wsResetUserBtn = document.getElementById('ws_reset_user_btn');
    const wsResetLearningBtn = document.getElementById('ws_reset_learning_btn');
    const ONBOARDING_WELCOME_KEY = 'jobHunter.onboardingWelcome';
    const ONBOARDING_WELCOME_OPT_OUT_KEY = 'jobHunter.onboardingWelcomeOptOut';
    const ONBOARDING_WIZARD_KEY = 'jobHunter.onboardingWizard';
    const isTestMode = document.body.dataset.testMode === 'true';

    function setTestMenuOpen(open) {
      if (!wsTestMenu || !wsTestTrigger) {
        return;
      }
      wsTestMenu.classList.toggle('is-open', Boolean(open));
      wsTestTrigger.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function clearOnboardingBrowserState() {
      try {
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        window.sessionStorage.removeItem(ONBOARDING_WIZARD_KEY);
      } catch {}
      try {
        window.localStorage.removeItem(ONBOARDING_WELCOME_OPT_OUT_KEY);
      } catch {}
    }

    async function postTestAction(path) {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || 'Request failed');
      }
      return payload;
    }

    function consumeOnboardingWelcomeState() {
      try {
        const raw = window.sessionStorage.getItem(ONBOARDING_WELCOME_KEY);
        if (!raw) {
          return null;
        }
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch {
        window.sessionStorage.removeItem(ONBOARDING_WELCOME_KEY);
        return null;
      }
    }

    function onboardingWelcomeOptedOut() {
      try {
        return window.localStorage.getItem(ONBOARDING_WELCOME_OPT_OUT_KEY) === '1';
      } catch {
        return false;
      }
    }

    function setOnboardingWelcomeOptOut(enabled) {
      try {
        if (enabled) {
          window.localStorage.setItem(ONBOARDING_WELCOME_OPT_OUT_KEY, '1');
        } else {
          window.localStorage.removeItem(ONBOARDING_WELCOME_OPT_OUT_KEY);
        }
      } catch {
        // Ignore storage errors in private mode or locked-down environments.
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderOnboardingWelcome() {
      if (!wsFlashMount) {
        return;
      }
      const state = consumeOnboardingWelcomeState();
      if (!state || onboardingWelcomeOptedOut()) {
        wsFlashMount.innerHTML = '';
        return;
      }

      const keyword = String(state.search_keywords || '').trim();
      const locations = Array.isArray(state.search_locations)
        ? state.search_locations.map((value) => String(value || '').trim()).filter(Boolean)
        : [];
      const searchSummary = [];
      if (keyword) {
        searchSummary.push(`keyword "${escapeHtml(keyword)}"`);
      }
      if (locations.length) {
        searchSummary.push(`locations ${escapeHtml(locations.join(', '))}`);
      }
      const title = state.kind === 'profile-refresh'
        ? 'Profile refreshed. This is your dashboard.'
        : 'Welcome. This is your dashboard.';
      const introCopy = state.kind === 'profile-refresh'
        ? 'We refreshed your profile from your latest CV. Your shortlist lives here, and the next search will use the updated profile automatically.'
        : 'We built your starting profile from your CV. This is where your shortlist appears and where new matches land after each search.';
      const subCopy = 'You should not need to know anything about internal files or extraction rules here. The important part is simple: review roles below, run another search when you want fresh results, and open Settings if you want to tune how matching works.';
      const searchNote = searchSummary.length
        ? `<div class="ws-flash-note">Your next search will use ${searchSummary.join(' and ')}.</div>`
        : '';

      wsFlashMount.innerHTML = `
        <section class="ws-flash-card is-visible" aria-label="Onboarding summary">
          <div class="ws-flash-body">
            <div>
              <div class="ws-flash-eyebrow">Welcome to Job Hunter</div>
              <h1 class="ws-flash-title">${title}</h1>
              <p class="ws-flash-copy">${introCopy}</p>
              <p class="ws-flash-subcopy">${subCopy}</p>
              <div class="ws-flash-steps">
                <div class="ws-flash-step">
                  <p class="ws-flash-step-title">1. Review the shortlist</p>
                  <p class="ws-flash-step-copy">The roles below are your current shortlist. Open any card to inspect it and decide what is worth your time.</p>
                </div>
                <div class="ws-flash-step">
                  <p class="ws-flash-step-title">2. Run a search when ready</p>
                  <p class="ws-flash-step-copy">Use <strong>Run Search Now</strong> in the Search Operations panel to fetch fresh roles. It can take a few minutes, and this dashboard will refresh when the run finishes.</p>
                </div>
                <div class="ws-flash-step">
                  <p class="ws-flash-step-title">3. Schedule or tune things in Settings</p>
                  <p class="ws-flash-step-copy">If you want hands-off searching, set a daily schedule there. You can also adjust titles, locations, salary, and other matching preferences.</p>
                </div>
              </div>
              ${searchNote}
            </div>
            <aside class="ws-flash-side">
              <h2>Quick start</h2>
              <p>This intro is just a handoff so you know where you are. Once dismissed, the dashboard below becomes the main thing you work from.</p>
              <p>If you already have saved roles, browse them now. If not, use Run Search Now in the Search Operations panel and wait here while the dashboard refreshes with fresh matches. If you prefer, you can set a daily schedule instead.</p>
              <div class="ws-flash-actions">
                  <a href="/settings#schedule-panel" class="btn btn-secondary" style="font-size: 0.84rem; padding: 8px 14px;">Set Daily Schedule</a>
                  <a href="/settings" class="btn btn-secondary" style="font-size: 0.84rem; padding: 8px 14px;">Open Settings</a>
                  <button class="btn btn-secondary" id="ws_flash_dismiss" type="button" style="font-size: 0.84rem; padding: 8px 14px;">Got it</button>
              </div>
              <label class="ws-flash-optout" for="ws_flash_opt_out">
                <input type="checkbox" id="ws_flash_opt_out">
                <span>Do not show this intro again</span>
              </label>
            </aside>
          </div>
        </section>
      `;

      const dismissButton = document.getElementById('ws_flash_dismiss');
      const optOut = document.getElementById('ws_flash_opt_out');
      if (optOut) {
        optOut.checked = onboardingWelcomeOptedOut();
      }
      const closeFlash = () => {
        if (optOut) {
          setOnboardingWelcomeOptOut(optOut.checked);
        }
        wsFlashMount.innerHTML = '';
      };
      if (dismissButton) {
        dismissButton.addEventListener('click', closeFlash);
      }
    }

if (isTestMode && wsTestPanel && wsTestTrigger && wsTestMenu) {
      wsTestPanel.hidden = false;

      wsTestTrigger.addEventListener('click', () => {
        setTestMenuOpen(!wsTestMenu.classList.contains('is-open'));
      });

      document.addEventListener('click', (event) => {
        if (!wsTestPanel.contains(event.target)) {
          setTestMenuOpen(false);
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          setTestMenuOpen(false);
        }
      });

      wsResetUserBtn?.addEventListener('click', async () => {
        const confirmed = window.confirm(
          'Reset current user?\n\n'
          + 'This clears the current profile, onboarding state, uploaded CV state, local review feedback, and job history.\n\n'
          + 'Shared learned signals will be preserved.'
        );
        if (!confirmed) {
          return;
        }
        try {
          setTestMenuOpen(false);
          const payload = await postTestAction('/api/test/reset-user');
          clearOnboardingBrowserState();
          window.location.href = payload.redirect_to || '/start';
        } catch (error) {
          window.alert(error.message || 'Could not reset current user.');
        }
      });

      wsResetLearningBtn?.addEventListener('click', async () => {
        const confirmed = window.confirm(
          'Reset global learning?\n\n'
          + 'This wipes the shared learned signal memory for every test user.\n\n'
          + 'This is dangerous and cannot be undone.'
        );
        if (!confirmed) {
          return;
        }
        try {
          setTestMenuOpen(false);
          const payload = await postTestAction('/api/test/reset-learning');
          window.alert(payload.message || 'Global learning reset.');
        } catch (error) {
          window.alert(error.message || 'Could not reset global learning.');
        }
      });
    }

    async function loadResults() {
      try {
        const resp = await fetch('/api/results-html');
        if (!resp.ok) {
          resultsMount.innerHTML = '<div style="padding:64px 24px;color:var(--text-muted);text-align:center;">Run a search first to see results.</div>';
          return;
        }
        const html = await resp.text();
        resultsMount.innerHTML = '';
        const range = document.createRange();
        const frag = range.createContextualFragment(html);
        resultsMount.appendChild(frag);
      } catch {
        resultsMount.innerHTML = '<div style="padding:64px 24px;color:var(--text-muted);text-align:center;">Could not load results. Try refreshing the page.</div>';
      }
    }

    (async () => {
      renderOnboardingWelcome();
      await loadResults();
    })();
  </script>
</body>
</html>
