<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/theme/themes.css">
  <link rel="stylesheet" href="/static/workspace/workspace-page.css">
  __JOB_HUNTER_BOOTSTRAP_SCRIPTS__
  <script src="/static/common/csrf.js"></script>
  <script type="module" src="/static/common/console-bridge.js"></script>
  <script src="/static/theme/theme-switcher.js"></script>
  <script type="module" src="/static/common/account-bar.js"></script>
</head>
<body data-test-mode="__JOB_HUNTER_DEBUG_MODE__">
  <header class="ws-header">
    <div class="ws-header__inner">
      __JOB_HUNTER_TOP_UTILITY_BAR__
    </div>
  </header>
  <div class="ws-flash-mount" id="ws_flash_mount"></div>
  <div class="job-hunter-wait-mount" id="ws_wait_mount" hidden></div>
  <div class="ws-run-info-mount" id="ws_run_info_mount"></div>
  <div class="ws-profile-status-mount" id="ws_profile_status_mount" hidden></div>
  <div id="results-mount"></div>

  <script>
    const wsFlashMount = document.getElementById('ws_flash_mount');
    const wsWaitMount = document.getElementById('ws_wait_mount');
    const wsRunInfoMount = document.getElementById('ws_run_info_mount');
    const wsProfileStatusMount = document.getElementById('ws_profile_status_mount');
    const resultsMount = document.getElementById('results-mount');
    const SHARED_UI_LABELS = window.__JOB_HUNTER_SHARED_UI_LABELS__ || {};
    const SEARCH_WAIT_COPY = String(SHARED_UI_LABELS.search_wait_copy || '').trim();
    const SEARCH_RUNNING_TITLE = String(SHARED_UI_LABELS.search_running_title || '').trim();
    const SEARCH_RUNNING_COPY = String(SHARED_UI_LABELS.search_running_copy || '').trim();
    const SEARCH_STARTING_TITLE = String(SHARED_UI_LABELS.search_starting_title || '').trim();
    const SEARCH_STARTING_COPY = String(SHARED_UI_LABELS.search_starting_copy || '').trim();
    const SEARCH_REFRESHING_TITLE = String(SHARED_UI_LABELS.search_refreshing_title || '').trim();
    const SEARCH_REFRESHING_COPY = String(SHARED_UI_LABELS.search_refreshing_copy || '').trim();
    const SEARCH_RUNNING_SUBCOPY = String(SHARED_UI_LABELS.search_running_subcopy || '').trim();
    const SEARCH_STARTING_SUBCOPY = String(SHARED_UI_LABELS.search_starting_subcopy || '').trim();
    const SEARCH_STOP_LABEL = String(SHARED_UI_LABELS.search_stop_label || '').trim();
    const SEARCH_PROGRESS_PREFIX = String(SHARED_UI_LABELS.search_progress_prefix || '').trim();
    const SEARCH_ELAPSED_PREFIX = String(SHARED_UI_LABELS.search_elapsed_prefix || '').trim();
    const SEARCH_STOPPING_TITLE = String(SHARED_UI_LABELS.search_stopping_title || '').trim();
    const SEARCH_STOPPING_COPY = String(SHARED_UI_LABELS.search_stopping_copy || '').trim();
    const SEARCH_STOPPING_SUBCOPY = String(SHARED_UI_LABELS.search_stopping_subcopy || '').trim();
    const ONBOARDING_STORAGE_SCOPE = String(window.__JOB_HUNTER_USER_SCOPE__ || '').trim();
    if (!ONBOARDING_STORAGE_SCOPE) {
      throw new Error('Missing account scope.');
    }
    if (!SEARCH_WAIT_COPY || !SEARCH_RUNNING_TITLE || !SEARCH_RUNNING_COPY || !SEARCH_STARTING_TITLE || !SEARCH_STARTING_COPY || !SEARCH_REFRESHING_TITLE || !SEARCH_REFRESHING_COPY || !SEARCH_RUNNING_SUBCOPY || !SEARCH_STARTING_SUBCOPY || !SEARCH_STOP_LABEL || !SEARCH_PROGRESS_PREFIX || !SEARCH_ELAPSED_PREFIX || !SEARCH_STOPPING_TITLE || !SEARCH_STOPPING_COPY || !SEARCH_STOPPING_SUBCOPY) {
      throw new Error('Missing shared search UI labels.');
    }
    function scopedOnboardingStorageKey(baseKey) {
      return `${baseKey}:${ONBOARDING_STORAGE_SCOPE}`;
    }
    const ONBOARDING_WELCOME_KEY = scopedOnboardingStorageKey('jobHunter.onboardingWelcome');
    const ONBOARDING_WIZARD_KEY = scopedOnboardingStorageKey('jobHunter.onboardingWizard');
    const ONBOARDING_KEYWORD_SPLIT_RE = /[,\n|/]+/;
    const RUN_INFO_DISMISSED_KEY = 'jobHunter.runInfoDismissed';
    const RUN_INFO_TITLE = 'What this means';
    const RUN_INFO_COPY = [
      'This search can take a few minutes because Job Hunter checks multiple sources, opens the job details that matter, and scores each match before it appears here.',
      'Daily automation schedule and notification targets are configured in the Settings screen.',
    ];
    const RUN_STATUS_POLL_INTERVAL_MS = 3000;
    const RUN_STATUS_MAX_ATTEMPTS = 60;
    const RESULTS_REFRESH_RETRY_DELAY_MS = 250;
    const RESULTS_REFRESH_MAX_ATTEMPTS = 4;
    const isTestMode = document.body.dataset.testMode === 'true';
    let runStatusPollHandle = null;
    let workspaceWaitState = null;
    let workspaceProfileStatus = null;
    let workspaceResultsLoadToken = 0;

    function clearOnboardingBrowserState() {
      try {
        window.localStorage.removeItem(ONBOARDING_WELCOME_KEY);
        window.localStorage.removeItem(ONBOARDING_WIZARD_KEY);
      } catch {}
    }

    function peekOnboardingWelcomeState() {
      try {
        const raw = window.localStorage.getItem(ONBOARDING_WELCOME_KEY);
        if (!raw) {
          return null;
        }
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch {
        return null;
      }
    }

    function extractWorkspaceRunId(html) {
      try {
        const documentFragment = new DOMParser().parseFromString(html, 'text/html');
        for (const script of documentFragment.querySelectorAll('script')) {
          const scriptText = String(script.textContent || '');
          const match = scriptText.match(/runId:\s*(["'`])([^"'`]+)\1/);
          if (match?.[2]) {
            return match[2].trim();
          }
        }
      } catch {}
      return '';
    }

    function consumeOnboardingWelcomeState() {
      try {
        const raw = window.localStorage.getItem(ONBOARDING_WELCOME_KEY);
        if (!raw) {
          return null;
        }
        window.localStorage.removeItem(ONBOARDING_WELCOME_KEY);
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' ? parsed : null;
      } catch {
        window.localStorage.removeItem(ONBOARDING_WELCOME_KEY);
        return null;
      }
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function splitProgressText(progress) {
      const text = String(progress || '').trim();
      if (!text) {
        return { step: '', activityItems: [], elapsed: '' };
      }
      const lines = text
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter(Boolean);
      if (lines.length > 1) {
        let elapsed = '';
        const lastLine = lines[lines.length - 1] || '';
        const elapsedMatch = lastLine.match(/^elapsed\s+(.+)$/i);
        if (elapsedMatch) {
          elapsed = String(elapsedMatch[1] || '').trim();
          lines.pop();
        }
        return {
          step: String(lines[0] || '').trim(),
          activityItems: lines.slice(1),
          elapsed,
        };
      }
      const segments = text.split(/\s+\|\s+/).map((segment) => segment.trim()).filter(Boolean);
      if (!segments.length) {
        return { step: '', activityItems: [], elapsed: '' };
      }
      let elapsed = '';
      const lastSegment = segments[segments.length - 1] || '';
      const elapsedMatch = lastSegment.match(/^elapsed\s+(.+)$/i);
      if (elapsedMatch) {
        elapsed = String(elapsedMatch[1] || '').trim();
        segments.pop();
      }
      return {
        step: String(segments[0] || '').trim(),
        activityItems: segments.slice(1),
        elapsed,
      };
    }

    function renderProgressStatusMarkup(progress) {
      const { step, activityItems, elapsed } = splitProgressText(progress);
      if (!step && !activityItems.length && !elapsed) {
        return '';
      }
      const reversedItems = activityItems.slice().reverse();
      return `
        <div class="wait-state__progress">
          ${step ? `
            <p class="wait-state__status wait-state__status--progress">
              <span class="wait-state__status-label">${escapeHtml(SEARCH_PROGRESS_PREFIX)}</span>
              <span class="wait-state__status-value">${escapeHtml(step)}</span>
            </p>
          ` : ''}
          ${reversedItems.length ? `
            <div class="wait-state__activity">
              <ul class="wait-state__activity-list">
                ${reversedItems.map((item) => `<li class="wait-state__activity-item">${escapeHtml(item)}</li>`).join('')}
              </ul>
            </div>
          ` : ''}
          ${elapsed ? `
            <p class="wait-state__status wait-state__status--elapsed">
              <span class="wait-state__status-label">${escapeHtml(SEARCH_ELAPSED_PREFIX)}</span>
              <span class="wait-state__status-value">${escapeHtml(elapsed)}</span>
            </p>
          ` : ''}
        </div>
      `;
    }

    function renderWorkspaceWait(state) {
      if (!wsWaitMount) {
        return;
      }
      if (!state) {
        workspaceWaitState = null;
        wsWaitMount.innerHTML = '';
        wsWaitMount.hidden = true;
        document.body.classList.remove('job-hunter-wait-active');
        return;
      }
      const nextState = {
        title: String(state.title || 'Working').trim() || 'Working',
        copy: String(state.copy || '').trim(),
        subcopy: String(state.subcopy || '').trim(),
        progress: String(state.progress || '').trim(),
        allowStop: Boolean(state.allowStop),
      };
      if (
        workspaceWaitState
        && workspaceWaitState.title === nextState.title
        && workspaceWaitState.copy === nextState.copy
        && workspaceWaitState.subcopy === nextState.subcopy
        && workspaceWaitState.progress === nextState.progress
        && workspaceWaitState.allowStop === nextState.allowStop
      ) {
        return;
      }
      workspaceWaitState = { ...nextState };
      const title = escapeHtml(nextState.title);
      const copy = escapeHtml(nextState.copy);
      const progress = renderProgressStatusMarkup(nextState.progress);
      const subcopy = escapeHtml(nextState.subcopy);
      wsWaitMount.hidden = false;
      document.body.classList.add('job-hunter-wait-active');
      wsWaitMount.innerHTML = `
        <div class="job-hunter-wait-backdrop" aria-hidden="true"></div>
        <div class="job-hunter-wait-shell">
          <div class="wait-state" role="status" aria-live="polite">
            <span class="wait-state__spinner" aria-hidden="true"></span>
            <p class="wait-state__title">${title}</p>
            ${copy ? `<p class="wait-state__copy">${copy}</p>` : ''}
            ${progress}
            ${subcopy ? `<p class="wait-state__subcopy">${subcopy}</p>` : ''}
            ${nextState.allowStop ? `
              <div class="wait-state__actions">
                <button class="btn btn-secondary" id="ws_stop_search_btn" type="button">${escapeHtml(SEARCH_STOP_LABEL)}</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function setOnboardingOverlayVisible(visible) {
      document.body.classList.toggle('ws-onboarding-active', Boolean(visible));
    }

    function workspaceProfileReady() {
      return Boolean(workspaceProfileStatus?.profile_ready_for_review);
    }

    function updateWorkspaceRunButtons() {
      const ready = workspaceProfileReady();
      const blockingReason = String(workspaceProfileStatus?.blocking_reason || '').trim();
      for (const button of [document.getElementById('ws_sidebar_run_btn'), document.getElementById('ws_flash_run_search')]) {
        if (!button) {
          continue;
        }
        button.disabled = !ready;
        button.setAttribute('aria-disabled', ready ? 'false' : 'true');
        if (ready) {
          button.removeAttribute('title');
        } else {
          button.title = blockingReason || 'Your profile is not ready for review.';
        }
      }
    }

    function renderWorkspaceProfileStatus() {
      if (!wsProfileStatusMount) {
        return;
      }
      const status = workspaceProfileStatus;
      if (!status || status.profile_ready_for_review) {
        wsProfileStatusMount.hidden = true;
        wsProfileStatusMount.innerHTML = '';
        return;
      }
      const reason = escapeHtml(String(status.blocking_reason || 'Your profile is not ready for review.'));
      wsProfileStatusMount.hidden = false;
      wsProfileStatusMount.innerHTML = `
        <div class="workspace-status-message">
          <div class="workspace-error-card">
            <strong class="workspace-error-card__title">Profile not ready for review</strong>
            <div class="workspace-error-card__copy">${reason}</div>
          </div>
          <div class="workspace-status-message__hint">Go back to onboarding, rebuild your profile, and finish setup before starting a search.</div>
        </div>
      `;
    }

    async function loadWorkspaceProfileStatus() {
      const response = await jobHunterFetch('/api/profile/status', { method: 'GET' });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.error || 'Could not check profile readiness.');
      }
      if (typeof payload.profile_ready_for_review !== 'boolean') {
        throw new Error('Could not check profile readiness.');
      }
      workspaceProfileStatus = payload;
      renderWorkspaceProfileStatus();
      updateWorkspaceRunButtons();
      return payload;
    }

    function splitOnboardingSummary(value) {
      return String(value || '')
        .split(ONBOARDING_KEYWORD_SPLIT_RE)
        .map((part) => String(part || '').trim())
        .filter(Boolean);
    }

    function buildOnboardingFooterSummary(state) {
      const titles = splitOnboardingSummary(state?.search_keywords).slice(0, 3);
      const locations = Array.isArray(state?.search_locations)
        ? state.search_locations.map((value) => String(value || '').trim()).filter(Boolean)
        : [];
      const parts = [...titles, ...locations.slice(0, 1)];
      return parts.length ? parts.join(' · ') : 'Your saved search is ready.';
    }

    function dismissOnboardingOverlay() {
      if (!wsFlashMount) {
        return;
      }
      wsFlashMount.innerHTML = '';
      setOnboardingOverlayVisible(false);
    }

    function updateResultsLoadingMessage(message) {
      const loading = document.getElementById('results-loading');
      if (loading) {
        const text = escapeHtml(String(message || 'Loading workspace'));
        loading.innerHTML = `
          <div class="wait-state" role="status" aria-live="polite">
            <span class="wait-state__spinner" aria-hidden="true"></span>
            <p class="wait-state__title">Loading workspace</p>
            <p class="wait-state__copy">${text}</p>
          </div>
        `;
      }
    }

    function runInfoDismissed() {
      try {
        return window.localStorage.getItem(RUN_INFO_DISMISSED_KEY) === '1';
      } catch {
        return false;
      }
    }

    function setRunInfoDismissed(enabled) {
      try {
        if (enabled) {
          window.localStorage.setItem(RUN_INFO_DISMISSED_KEY, '1');
        } else {
          window.localStorage.removeItem(RUN_INFO_DISMISSED_KEY);
        }
      } catch {
        // Ignore storage errors in private mode or locked-down environments.
      }
    }

    function hideRunInfoPopup() {
      if (!wsRunInfoMount) {
        return;
      }
      wsRunInfoMount.innerHTML = '';
    }

    function showRunInfoPopup() {
      if (!wsRunInfoMount || runInfoDismissed()) {
        hideRunInfoPopup();
        return;
      }
      wsRunInfoMount.innerHTML = `
        <div class="ws-run-info-backdrop" aria-hidden="true"></div>
        <div class="ws-run-info-shell">
          <section class="ws-run-info-card" role="dialog" aria-modal="true" aria-label="${RUN_INFO_TITLE}">
            <h2 class="ws-run-info-title">${RUN_INFO_TITLE}</h2>
            ${RUN_INFO_COPY.map((copy) => `<p class="ws-run-info-copy">${escapeHtml(copy)}</p>`).join('')}
            <div class="ws-run-info-actions">
              <button class="btn btn-secondary" id="ws_run_info_stop" type="button">${escapeHtml(SEARCH_STOP_LABEL)}</button>
              <button class="btn btn-primary" id="ws_run_info_ack" type="button">Got it</button>
            </div>
          </section>
        </div>
      `;
      const ackButton = document.getElementById('ws_run_info_ack');
      const stopButton = document.getElementById('ws_run_info_stop');
      ackButton?.addEventListener('click', () => {
        setRunInfoDismissed(true);
        hideRunInfoPopup();
      });
      stopButton?.addEventListener('click', () => {
        hideRunInfoPopup();
        stopWorkspaceRun();
      });
      ackButton?.focus();
    }

    function ensureSidebarRunButton() {
      if (!resultsMount || resultsMount.querySelector('#ws_sidebar_run_btn')) {
        return;
      }
      const searchMeta = resultsMount.querySelector('.workspace-sidebar .snapshot-meta--common-search');
      if (!searchMeta) {
        return;
      }
      const actions = document.createElement('div');
      actions.className = 'search-settings-actions';
      actions.innerHTML = `
        <button class="btn btn-primary" id="ws_sidebar_run_btn" type="button">Run search</button>
        <p class="snapshot-helper">New searches add to your existing results. Nothing is lost.</p>
      `;
      searchMeta.insertAdjacentElement('afterend', actions);
      updateWorkspaceRunButtons();
    }

    function stopRunStatusPolling() {
      if (runStatusPollHandle) {
        window.clearInterval(runStatusPollHandle);
        runStatusPollHandle = null;
      }
    }

    function startRunStatusPolling() {
      if (runStatusPollHandle) {
        return;
      }
      runStatusPollHandle = window.setInterval(syncWorkspaceRunStatus, RUN_STATUS_POLL_INTERVAL_MS);
    }

    async function syncWorkspaceRunStatus() {
      try {
        const response = await jobHunterFetch('/api/run-status', { method: 'GET' });
        if (!response.ok) {
          throw new Error('Could not check run status.');
        }
        const payload = await response.json().catch(() => ({}));
        if (payload?.status === 'running') {
          renderWorkspaceWait({
            title: SEARCH_RUNNING_TITLE,
            copy: SEARCH_RUNNING_COPY,
            subcopy: SEARCH_RUNNING_SUBCOPY,
            progress: payload?.progress || '',
            allowStop: true,
          });
          startRunStatusPolling();
          return true;
        }
        if (payload?.status === 'stopping') {
          renderWorkspaceWait({
            title: SEARCH_STOPPING_TITLE,
            copy: SEARCH_STOPPING_COPY,
            subcopy: SEARCH_STOPPING_SUBCOPY,
            progress: payload?.progress || '',
            allowStop: false,
          });
          startRunStatusPolling();
          return true;
        }
        stopRunStatusPolling();
        if (workspaceWaitState) {
          renderWorkspaceWait(null);
          await loadResults(String(payload?.last_run_at || '').trim());
        }
        return false;
      } catch {
        return false;
      }
    }

    async function startWorkspaceRunFromOverlay() {
      if (!workspaceProfileReady()) {
        renderWorkspaceProfileStatus();
        const reason = String(workspaceProfileStatus?.blocking_reason || 'Your profile is not ready for review.');
        updateResultsLoadingMessage(reason);
        window.alert(reason);
        return;
      }
      renderWorkspaceWait({
        title: SEARCH_STARTING_TITLE,
        copy: SEARCH_STARTING_COPY,
        subcopy: SEARCH_STARTING_SUBCOPY,
        progress: '',
        allowStop: true,
      });
      try {
        const response = await jobHunterFetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}',
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'Could not start search.');
        }
        renderWorkspaceWait({
          title: SEARCH_RUNNING_TITLE,
          copy: SEARCH_RUNNING_COPY,
          subcopy: SEARCH_RUNNING_SUBCOPY,
          progress: '',
          allowStop: true,
        });
        showRunInfoPopup();
        pollRunStatusAfterOverlayStart();
      } catch (error) {
        renderWorkspaceWait(null);
        updateResultsLoadingMessage('Could not start search. Refresh the page and try again.');
        window.alert(error.message || 'Could not start search.');
      }
    }

    async function stopWorkspaceRun() {
      hideRunInfoPopup();
      try {
        const response = await jobHunterFetch('/api/run/stop', { method: 'POST' });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload.error || 'Could not stop search.');
        }
        renderWorkspaceWait({
          title: SEARCH_STOPPING_TITLE,
          copy: SEARCH_STOPPING_COPY,
          subcopy: SEARCH_STOPPING_SUBCOPY,
          progress: '',
          allowStop: false,
        });
        startRunStatusPolling();
      } catch (error) {
        window.alert(error.message || 'Could not stop search.');
      }
    }

    async function pollRunStatusAfterOverlayStart(attempt = 0) {
      try {
        const response = await jobHunterFetch('/api/run-status', { method: 'GET' });
        if (!response.ok) {
          throw new Error('Could not check run status.');
        }
        const payload = await response.json().catch(() => ({}));
        if (payload?.status === 'running' && attempt < RUN_STATUS_MAX_ATTEMPTS) {
          // Run confirmed active — hand off to the regular interval so there is only one poller.
          startRunStatusPolling();
          return;
        }
        if (payload?.status === 'stopping' && attempt < RUN_STATUS_MAX_ATTEMPTS) {
          renderWorkspaceWait({
            title: SEARCH_STOPPING_TITLE,
            copy: SEARCH_STOPPING_COPY,
            subcopy: SEARCH_STOPPING_SUBCOPY,
            allowStop: false,
          });
          window.setTimeout(() => pollRunStatusAfterOverlayStart(attempt + 1), RUN_STATUS_POLL_INTERVAL_MS);
          return;
        }
        renderWorkspaceWait({
          ...(workspaceWaitState || {}),
          title: SEARCH_REFRESHING_TITLE,
          copy: SEARCH_REFRESHING_COPY,
          progress: '',
          allowStop: false,
        });
        await loadResults(String(payload?.last_run_at || '').trim());
        renderWorkspaceWait(null);
      } catch (error) {
        if (attempt < RUN_STATUS_MAX_ATTEMPTS) {
          window.setTimeout(() => pollRunStatusAfterOverlayStart(attempt + 1), RUN_STATUS_POLL_INTERVAL_MS);
          return;
        }
        renderWorkspaceWait(null);
        updateResultsLoadingMessage('Could not refresh results. Refresh the page if needed.');
      }
    }

    async function renderOnboardingWelcome() {
      if (!wsFlashMount) {
        return;
      }
      const state = peekOnboardingWelcomeState();
      if (!state) {
        dismissOnboardingOverlay();
        return;
      }

      setOnboardingOverlayVisible(true);
      const nextSearchSummary = escapeHtml(buildOnboardingFooterSummary(state));
      const profileSourceCopy = state.kind === 'profile-refresh'
        ? 'We rebuilt this from your latest CV.'
        : 'We built this from your CV.';

      wsFlashMount.innerHTML = `
        <div class="ws-flash-backdrop" data-onboarding-backdrop></div>
        <div class="ws-flash-shell">
          <section class="ws-flash-card is-visible" role="dialog" aria-modal="true" aria-label="Onboarding summary">
            <button class="ws-flash-close" id="ws_flash_dismiss" type="button" aria-label="Close">&times;</button>
            <div class="ws-flash-body">
              <div class="ws-flash-main">
                <h1 class="ws-flash-title">Welcome</h1>
                <p class="ws-flash-subtitle">Your AI job search workspace is ready.</p>
                <p class="ws-flash-helper">${profileSourceCopy} We prepared your first search settings so you can start from here.</p>
                <div class="ws-flash-footer">Next search: ${nextSearchSummary}</div>
              </div>
              <aside class="ws-flash-side">
                <h2>Quick start</h2>
                <div class="ws-flash-action-list">
                  <button class="btn btn-primary ws-flash-primary" id="ws_flash_run_search" type="button">Run search</button>
                </div>
              </aside>
            </div>
          </section>
        </div>
      `;

      const backdrop = wsFlashMount.querySelector('[data-onboarding-backdrop]');
      const dismissButton = document.getElementById('ws_flash_dismiss');
      const runSearchButton = document.getElementById('ws_flash_run_search');      
      const closeFlash = () => {
        consumeOnboardingWelcomeState();
        dismissOnboardingOverlay();
      };
      const closeAndRunSearch = () => {
        closeFlash();
        startWorkspaceRunFromOverlay();
      };
      if (backdrop) {
        backdrop.addEventListener('click', closeFlash);
      }
      if (dismissButton) {
        dismissButton.addEventListener('click', closeFlash);
      }
      if (runSearchButton) {
        runSearchButton.addEventListener('click', closeAndRunSearch);
      }
      updateWorkspaceRunButtons();
    }



    async function loadResults(expectedRunId = '', attempt = 0) {
      const requestToken = ++workspaceResultsLoadToken;
      try {
        const resultsUrl = expectedRunId
          ? `/api/results-html?run_id=${encodeURIComponent(expectedRunId)}`
          : '/api/results-html';
        const resp = await jobHunterFetch(resultsUrl, { cache: 'no-store' });
        if (!resp.ok) {
          const runStats = await jobHunterFetch('/api/run-stats').then(r => r.ok ? r.json() : {}).catch(() => ({}));
          const lastError = runStats.last_run_error;
          if (lastError) {
            resultsMount.innerHTML = `
              <div class="workspace-status-message">
                <div class="workspace-error-card">
                  <strong class="workspace-error-card__title">Last search failed</strong>
                  <code class="workspace-error-card__code">${lastError.replace(/</g,'&lt;')}</code>
                </div>
                <div class="workspace-status-message__hint">Fix the issue above and run the search again.</div>
                <button class="btn btn-primary" id="ws_error_run_search" type="button" style="margin-top:1rem;">Run search</button>
              </div>`;
            document.getElementById('ws_error_run_search')?.addEventListener('click', startWorkspaceRunFromOverlay);
          } else {
            resultsMount.innerHTML = `
              <div class="workspace-status-message">
                <div class="workspace-status-message__hint">No results yet — run a search first.</div>
                <button class="btn btn-primary" id="ws_no_results_run_search" type="button" style="margin-top:1rem;">Run search</button>
              </div>`;
            document.getElementById('ws_no_results_run_search')?.addEventListener('click', startWorkspaceRunFromOverlay);
          }
          return;
        }
        const html = await resp.text();
        const renderedRunId = extractWorkspaceRunId(html);
        if (expectedRunId && renderedRunId && renderedRunId !== expectedRunId) {
          if (attempt < RESULTS_REFRESH_MAX_ATTEMPTS) {
            window.setTimeout(() => loadResults(expectedRunId, attempt + 1), RESULTS_REFRESH_RETRY_DELAY_MS);
            return;
          }
          console.warn('Workspace results were still catching up, so the latest saved workspace will be shown.');
        }
        if (requestToken !== workspaceResultsLoadToken) {
          return;
        }
        resultsMount.innerHTML = '';
        const range = document.createRange();
        const frag = range.createContextualFragment(html);
        resultsMount.appendChild(frag);
        ensureSidebarRunButton();
      } catch (error) {
        if (requestToken !== workspaceResultsLoadToken) {
          return;
        }
        if (expectedRunId && attempt < RESULTS_REFRESH_MAX_ATTEMPTS) {
          window.setTimeout(() => loadResults(expectedRunId, attempt + 1), RESULTS_REFRESH_RETRY_DELAY_MS);
          return;
        }
        const message = escapeHtml(String(error?.message || 'Could not load results. Try refreshing the page.'));
        resultsMount.innerHTML = `<div class="workspace-status-message"><div class="workspace-status-message__hint">${message}</div></div>`;
      }
    }
    document.addEventListener('click', (event) => {
      if (event.target.closest('#ws_sidebar_run_btn')) {
        startWorkspaceRunFromOverlay();
        return;
      }
      if (event.target.closest('#ws_stop_search_btn')) {
        stopWorkspaceRun();
      }
    });

    (async () => {
      const isRunning = await syncWorkspaceRunStatus();
      try {
        await loadWorkspaceProfileStatus();
      } catch (error) {
        workspaceProfileStatus = {
          has_profile: false,
          has_candidate_capabilities: false,
          candidate_capability_count: 0,
          profile_ready_for_review: false,
          blocking_reason: String(error?.message || 'Could not check profile readiness.'),
        };
        renderWorkspaceProfileStatus();
        updateWorkspaceRunButtons();
      }
      if (!isRunning) {
        let overlayTimer = window.setTimeout(
          () => renderWorkspaceWait({ title: 'Loading workspace', copy: 'Fetching the latest search results.' }),
          500,
        );
        try {
          await loadResults();
        } finally {
          window.clearTimeout(overlayTimer);
          renderWorkspaceWait(null);
        }
      }
      await renderOnboardingWelcome();
    })();
  </script>
</body>
</html>
