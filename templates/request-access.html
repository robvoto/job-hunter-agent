<!DOCTYPE html>
<html lang="en" data-theme="dark-professional">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__JOB_HUNTER_ACCESS_REQUEST_PAGE_TITLE__</title>
  <link rel="stylesheet" href="/static/theme/themes.css">
  <link rel="stylesheet" href="/static/login/login-page.css">
</head>
<body class="login-page">
  <main class="login-shell" aria-label="__JOB_HUNTER_ACCESS_REQUEST_ARIA_LABEL__">
    <section class="login-auth" aria-labelledby="request_access_title">
      <div class="login-auth__content">
        <div class="login-card">
          <img src="/static/assets/job_hunter_img.png" alt="" class="login-card__logo">
          <h1 class="login-card__title" id="request_access_title">__JOB_HUNTER_ACCESS_REQUEST_HEADING__</h1>
          <p class="login-card__copy">__JOB_HUNTER_ACCESS_VERIFIED_COPY__</p>
          <p class="login-card__copy">__JOB_HUNTER_ACCESS_REQUEST_COPY__</p>
          <div class="panel-actions">
            <form action="/request-access" method="post">
              <input type="hidden" name="csrf_token" value="__JOB_HUNTER_CSRF_TOKEN__">
              <button class="jh-button jh-button--primary" type="submit">__JOB_HUNTER_ACCESS_REQUEST_BUTTON_LABEL__</button>
            </form>
            <form action="/logout" method="post">
              <input type="hidden" name="csrf_token" value="__JOB_HUNTER_CSRF_TOKEN__">
              <button class="jh-button jh-button--neutral" type="submit">__JOB_HUNTER_ACCESS_SIGN_OUT_LABEL__</button>
            </form>
          </div>
        </div>
      </div>
      __JOB_HUNTER_APP_FOOTER__
    </section>
  </main>
</body>
</html>
