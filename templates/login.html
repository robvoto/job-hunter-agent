<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Job Hunter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f1f5f9;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px 40px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    h1 { font-size: 1.5rem; margin: 0 0 6px; color: #0f172a; font-weight: 700; }
    .subtitle { color: #64748b; margin: 0 0 36px; font-size: 0.95rem; }
    .btn-google {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 11px 24px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      text-decoration: none;
      transition: box-shadow .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn-google:hover {
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      border-color: #9ca3af;
    }
    .error-msg {
      color: #dc2626;
      font-size: 0.85rem;
      margin-top: 20px;
      padding: 10px 14px;
      background: #fef2f2;
      border-radius: 6px;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Job Hunter</h1>
    <p class="subtitle">Sign in to access your workspace</p>
    <a class="btn-google" href="/login/google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.013 17.64 11.706 17.64 9.2z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
      </svg>
      Sign in with Google
    </a>
    <div id="error-container"></div>
  </div>
  <script>
    const ERROR_MESSAGES = {
      state_mismatch: 'Login attempt expired or was tampered with. Please try again.',
      no_code: 'Google did not return an authorisation code. Please try again.',
      no_email: 'Could not retrieve your email from Google.',
      email_not_verified: 'Your Google account email is not verified.',
      token_exchange_failed: 'Sign-in failed while contacting Google. Please try again.',
    };
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err) {
      const el = document.getElementById('error-container');
      const p = document.createElement('p');
      p.className = 'error-msg';
      p.textContent = ERROR_MESSAGES[err] || ('Sign-in failed: ' + err);
      el.appendChild(p);
    }
  </script>
</body>
</html>
