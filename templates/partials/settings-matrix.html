        <section id="section-matrix" class="settings-group" data-screen="settings">
          <h2 class="section-title">Capability Matrix</h2>
          <section class="panel advanced-shell">
            <div class="advanced-head">
              <div class="panel-kicker">Scoring signals</div>
              <h2>Capability Matrix</h2>
              <p class="panel-copy">Each row is a capability Job Hunter can use when judging whether you are a good fit for a role.</p>
            </div>
            <div class="capability-toolbar">
              <div class="capability-toolbar-main">
                <input id="capability_matrix_filter" class="capability-filter" type="search" placeholder="Filter capabilities">
                <span class="capability-toolbar-copy"></span>
              </div>
              <button class="secondary" id="add_capability_rule" type="button">Add capability</button>
            </div>
            <div id="capability_matrix_editor" class="capability-editor"></div>
            <textarea id="capability_profile_rules" class="technical-rule-source" aria-hidden="true" tabindex="-1"></textarea>
          </section>
        </section>
