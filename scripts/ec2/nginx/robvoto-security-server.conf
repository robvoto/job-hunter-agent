# Apply a conservative per-client request budget before proxying to FastAPI.
limit_req zone=robvoto_per_ip burst=40 nodelay;

# Never proxy hidden files or secret/configuration paths to an application.
# ACME challenge files remain available for certificate renewal.
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}

# These public applications do not serve executable server-side script files.
location ~* \.(?:php|phtml|phar|cgi|pl|asp|aspx|jsp)$ {
    return 404;
}

# Reject common framework and device exploit probes before they reach FastAPI.
location ~* ^/(?:wp-admin|wp-content|wp-includes|xmlrpc\.php|cgi-bin|actuator|vendor/phpunit)(?:/|$) {
    return 404;
}
