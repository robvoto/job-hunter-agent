name: Release integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked --dev

      - name: Validate release metadata
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: uv run python scripts/check-release-integrity.py

      - name: Validate release tag against application version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv run python scripts/check-release-integrity.py --tag "${GITHUB_REF_NAME}"

      - name: Run release-management tests
        run: uv run pytest tests/test_release_management.py tests/test_settings_rendering.py -q

      - name: Install Playwright Chromium
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv run playwright install --with-deps chromium

      - name: Run non-LLM Playwright release suite
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: ./scripts/run-e2e.sh -q
